<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset Password | LonerPay</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf8f2;color:#28251e;font-family:system-ui,sans-serif;padding:32px 20px}main{max-width:440px;margin:6vh auto;background:white;border:1px solid #e5dac4;border-radius:24px;padding:28px}.logo{display:grid;place-items:center;width:64px;height:64px;background:#936514;color:white;border-radius:18px;font-size:36px}h1{font-size:27px}p{color:#746c5c;line-height:1.6}label{display:block;margin:18px 0 8px;font-weight:600}input{width:100%;padding:15px;border:1px solid #d6c7a8;border-radius:12px;font:inherit}button{width:100%;margin-top:24px;padding:16px;background:#936514;color:white;border:0;border-radius:12px;font:inherit;font-weight:700}button:disabled{opacity:.6}a{color:#936514}#status{overflow-wrap:anywhere}form[hidden]{display:none}</style><link rel="stylesheet" href="site-gold.css?v=20261017-unified"></head>
<body class="lp-gold-site lp-gold-public"><main><div class="logo">L</div><h1>Create a new password</h1><p id="status" role="status" aria-live="polite">Checking your reset link…</p>
<form id="resetForm" hidden><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="save">Save new password</button></form>
<p><a href="https://lonerpay.com/index.html">Back to login</a></p></main>
<script>
(async function(){
  "use strict";
  const params=new URLSearchParams(location.hash.slice(1));
  let token=params.get("access_token");
  const recovery=params.get("type")==="recovery";
  const linkError=params.has("error")||params.has("error_code");
  // Remove credentials from browser history before making requests.
  history.replaceState(null,"",location.pathname);
  const status=document.getElementById("status"),form=document.getElementById("resetForm"),save=document.getElementById("save");
  let config;
  function invalid(){token=null;form.hidden=true;status.textContent="This reset link is invalid or expired. Return to login and request a new password-reset email.";}
  if(linkError||!recovery||!token){invalid();return;}
  try{
    const response=await fetch("/api/config",{cache:"no-store"});
    config=await response.json();
    if(!response.ok||!config.supabaseUrl||!config.supabasePublishableKey)throw Error();
    const user=await fetch(config.supabaseUrl+"/auth/v1/user",{headers:{apikey:config.supabasePublishableKey,Authorization:"Bearer "+token},cache:"no-store"});
    if(!user.ok){invalid();return;}
    form.hidden=false;status.textContent="Choose a password with at least 8 characters.";document.getElementById("password").focus();
  }catch{status.textContent="Could not check your reset link. Please request a new link and try again.";token=null;return;}
  form.addEventListener("submit",async function(event){
    event.preventDefault();
    const password=document.getElementById("password").value,confirmation=document.getElementById("confirm").value;
    if(password.length<8){status.textContent="Use at least 8 characters.";return;}
    if(password!==confirmation){status.textContent="The passwords do not match.";return;}
    if(!token){invalid();return;}
    save.disabled=true;save.textContent="Saving…";
    try{
      const response=await fetch(config.supabaseUrl+"/auth/v1/user",{method:"PUT",headers:{apikey:config.supabasePublishableKey,Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({password})});
      const data=await response.json().catch(()=>({}));
      if(response.status===401||response.status===403){invalid();return;}
      if(!response.ok)throw Error(data.msg||data.message||"Could not change your password. Please try again.");
      // End the recovery session and require normal sign-in.
      await fetch(config.supabaseUrl+"/auth/v1/logout?scope=global",{method:"POST",headers:{apikey:config.supabasePublishableKey,Authorization:"Bearer "+token}}).catch(()=>{});
      token=null;form.reset();form.hidden=true;
      localStorage.removeItem("lonerpay_access_token");localStorage.removeItem("lonerpay_refresh_token");
      status.textContent="Your password has been changed. Return to login and sign in with your new password.";
    }catch(error){status.textContent=error.message||"Could not change your password. Please try again.";}
    finally{save.disabled=false;save.textContent="Save new password";}
  });
})();
</script></body></html>
