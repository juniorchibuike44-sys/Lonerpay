<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LonerPay Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 18px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 26px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .profile-card {
      background: white;
      border-radius: 18px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      background: #f59e0b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
    }

    .profile-card h2 {
      margin: 15px 0 5px;
    }

    .profile-card p {
      margin: 0;
      color: #6b7280;
    }

    .menu {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .menu button {
      width: 100%;
      border: none;
      border-bottom: 1px solid #e5e7eb;
      background: white;
      padding: 18px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .menu button:last-child {
      border-bottom: none;
    }

    .menu button:active {
      background: #f3f4f6;
    }

    .logout {
      color: #dc2626;
      font-weight: bold;
    }

    .version {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      margin-top: 25px;
    }

    .pin-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.65);
    }

    .pin-card {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 20px;
      background: white;
    }

    .pin-card input {
      width: 100%;
      padding: 13px;
      margin: 7px 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 18px;
      letter-spacing: 8px;
      text-align: center;
    }

    .pin-primary, .pin-cancel {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      font-size: 16px;
    }

    .pin-primary { background: #111827; color: white; font-weight: bold; }
    .pin-cancel { margin-top: 7px; background: transparent; }
  </style>
</head>

<body>
  <div class="header">
    <a class="back" href="dashboard.html">←</a>
    <h1>My Profile</h1>
  </div>

  <main class="container">
    <section class="profile-card">
      <div class="avatar">L</div>
      <h2>LonerPay User</h2>
      <p>Manage your account and security</p>
    </section>

    <section class="menu">
            <button onclick="editProfile()"> 
        👤 Personal Information
      </button>

            <button onclick="securitySettings()"> 
        🔐 Security and PIN
      </button>

            <button onclick="toggleNotifications()"> 
        🔔 Notifications
      </button>

            <button onclick="contactSupport()"> 
        💬 Help and Support
      </button>

      <button class="logout" onclick="logout()">
        🚪 Log Out
      </button>
    </section>

    <p class="version">LonerPay Version 1.0</p>
  </main>

  <script>
    function showMessage(message) {
      alert(message);
    }

    function logout() {
      const confirmed = confirm("Are you sure you want to log out?");

      if (confirmed) {
        localStorage.removeItem("lonerpay_access_token");
        localStorage.removeItem("lonerpay_refresh_token");
        window.location.href = "index.html";
      }
    }    function loadProfile() {
      const savedName =
        localStorage.getItem("lonerpayProfileName") || "LonerPay User";

      const savedPhone =
        localStorage.getItem("lonerpayProfilePhone") ||
        "Manage your account and security";

      document.querySelector(".profile-card h2").textContent = savedName;
      document.querySelector(".profile-card p").textContent = savedPhone;
      document.querySelector(".avatar").textContent =
        savedName.charAt(0).toUpperCase();
    }

    function editProfile() {
      const currentName =
        localStorage.getItem("lonerpayProfileName") || "";

      const currentPhone =
        localStorage.getItem("lonerpayProfilePhone") || "";

      const name = prompt("Enter your full name:", currentName);
      if (name === null || name.trim() === "") return;

      const phone = prompt("Enter your phone number:", currentPhone);
      if (phone === null || phone.trim() === "") return;

      localStorage.setItem("lonerpayProfileName", name.trim());
      localStorage.setItem("lonerpayProfilePhone", phone.trim());

      loadProfile();
      alert("Personal information saved successfully.");
    }

    document.querySelector(".menu button").onclick = editProfile;
    loadProfile();

    async function securitySettings() {
      const accessToken = localStorage.getItem("lonerpay_access_token");
      if (!accessToken) {
        alert("Please log in again to manage your payment PIN.");
        window.location.href = "index.html";
        return;
      }

      try {
        const statusResponse = await fetch("/api/pin", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${accessToken}`
          },
          body: JSON.stringify({ action: "status" })
        });
        const status = await statusResponse.json();
        if (!statusResponse.ok) throw new Error(status.error || "Could not load PIN settings");
        showPinForm(status.has_pin);
      } catch (error) {
        alert(error.message);
      }
    }

    function showPinForm(hasPin) {
      const overlay = document.createElement("div");
      overlay.className = "pin-overlay";
      overlay.innerHTML = `
        <div class="pin-card">
          <h2 style="margin-top:0;">${hasPin ? "Change Payment PIN" : "Create Payment PIN"}</h2>
          <p style="color:#6b7280;">Use exactly four digits. Never share this PIN with anyone.</p>
          ${hasPin ? `<label>Current PIN</label><input id="currentPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">` : ""}
          <label>New PIN</label>
          <input id="newPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
          <label>Confirm new PIN</label>
          <input id="confirmPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
          <button class="pin-primary" id="savePin">${hasPin ? "Change PIN" : "Create PIN"}</button>
          <button class="pin-cancel" id="cancelPin">Cancel</button>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector("#cancelPin").onclick = () => overlay.remove();
      overlay.querySelector("#savePin").onclick = async event => {
        const button = event.currentTarget;
        const newPin = overlay.querySelector("#newPin").value;
        const confirmedPin = overlay.querySelector("#confirmPin").value;
        const currentPin = hasPin ? overlay.querySelector("#currentPin").value : "";
        if (!/^\d{4}$/.test(newPin)) return alert("PIN must contain exactly 4 digits.");
        if (newPin !== confirmedPin) return alert("The new PIN entries do not match.");
        if (hasPin && !/^\d{4}$/.test(currentPin)) return alert("Enter your current 4-digit PIN.");

        button.disabled = true;
        button.textContent = "Saving...";
        try {
          const response = await fetch("/api/pin", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${localStorage.getItem("lonerpay_access_token")}`
            },
            body: JSON.stringify({
              action: hasPin ? "change" : "set",
              pin: newPin,
              current_pin: currentPin
            })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Could not save payment PIN");
          overlay.remove();
          alert(data.message);
        } catch (error) {
          alert(error.message);
          button.disabled = false;
          button.textContent = hasPin ? "Change PIN" : "Create PIN";
        }
      };
    }

    function updateNotificationButton() {
      const enabled =
        localStorage.getItem("lonerpayNotifications") === "enabled";

      const buttons = document.querySelectorAll(".menu button");
      buttons[2].textContent =
        enabled ? "🔔 Notifications: ON" : "🔕 Notifications: OFF";
    }

    function toggleNotifications() {
      const enabled =
        localStorage.getItem("lonerpayNotifications") === "enabled";

      localStorage.setItem(
        "lonerpayNotifications",
        enabled ? "disabled" : "enabled"
      );

      updateNotificationButton();

      alert(
        enabled
          ? "Notifications have been turned off."
          : "Notifications have been turned on."
      );
    }

    function contactSupport() {
      const message = encodeURIComponent(
        "Hello LonerPay Support, I need assistance with my account."
      );

      window.location.href =
        "https://wa.me/2349131123780?text=" + message;
    }

    updateNotificationButton(); 
  </script>
</body>
</html>
