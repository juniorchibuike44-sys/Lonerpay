<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LonerPay Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 18px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 26px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .profile-card {
      background: white;
      border-radius: 18px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      background: #f59e0b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
    }

    .profile-card h2 {
      margin: 15px 0 5px;
    }

    .profile-card p {
      margin: 0;
      color: #6b7280;
    }

    .menu {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .menu button {
      width: 100%;
      border: none;
      border-bottom: 1px solid #e5e7eb;
      background: white;
      padding: 18px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .menu button:last-child {
      border-bottom: none;
    }

    .menu button:active {
      background: #f3f4f6;
    }

    .logout {
      color: #dc2626;
      font-weight: bold;
    }

    .version {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      margin-top: 25px;
    }

    .pin-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.65);
    }

    .pin-card {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 20px;
      background: white;
    }

    .pin-card input {
      width: 100%;
      padding: 13px;
      margin: 7px 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 18px;
      letter-spacing: 8px;
      text-align: center;
    }

    .pin-primary, .pin-cancel {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      font-size: 16px;
    }

    .pin-primary { background: #111827; color: white; font-weight: bold; }
    .pin-cancel { margin-top: 7px; background: transparent; }
    
    /* Professional LonerPay popup + notification */
.lp-overlay {
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
}

.lp-modal {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.lp-modal h2 {
    margin: 0 0 8px;
    color: #111827;
    font-size: 24px;
}

.lp-modal p {
    margin: 0 0 20px;
    color: #6b7280;
    line-height: 1.5;
}

.lp-modal label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #111827;
}

.lp-modal input {
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

.lp-modal input:focus {
    border-color: #0b8f45;
}

.lp-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.lp-actions button {
    flex: 1;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
}

.lp-cancel {
    background: #f3f4f6;
    color: #374151;
}

.lp-save {
    background: #0b8f45;
    color: white;
}

.lp-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translate(-50%, -120px);
    width: calc(100% - 40px);
    max-width: 420px;
    background: #111827;
    color: white;
    padding: 16px 18px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
    z-index: 10000;
    opacity: 0;
    transition: .3s ease;
}

.lp-toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
} 
  </style>
</head>

<body>
  <!-- LonerPay Professional Modal -->
<div id="lpOverlay" class="lp-overlay">
  <div class="lp-modal">
    <h2 id="lpModalTitle">LonerPay</h2>
    <p id="lpModalText"></p>

    <div id="lpModalInputArea" style="display:none;">
      <label id="lpModalLabel" for="lpModalInput">Information</label>
      <input id="lpModalInput" type="text" autocomplete="off">
    </div>

    <div class="lp-actions">
      <button type="button" class="lp-cancel" onclick="closeLpModal()">
        Cancel
      </button>
      <button type="button" class="lp-save" id="lpModalSave">
        Save
      </button>
    </div>
  </div>
</div>

<div id="lpToast" class="lp-toast"></div> 
  <div class="header">
    <a class="back" href="dashboard.html">←</a>
    <h1>My Profile</h1>
  </div>

  <main class="container">
    <section class="profile-card">
      <div class="avatar">L</div>
      <h2>LonerPay User</h2>
      <p>Manage your account and security</p>
    </section>

    <section class="menu">
            <button onclick="editProfile()"> 
        👤 Personal Information
      </button>

            <button onclick="securitySettings()"> 
        🔐 Security and PIN
      </button>

            <button onclick="toggleNotifications()"> 
        🔔 Notifications
      </button>

            <button onclick="contactSupport()"> 
        💬 Help and Support
      </button>

      <button class="logout" onclick="logout()">
        🚪 Log Out
      </button>
    </section>

    <p class="version">LonerPay Version 1.0</p>
  </main>
<script> 
  function showMessage(message) {
    const toast = document.getElementById("lpToast");
    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}

function closeLpModal() {
    document.getElementById("lpOverlay").style.display = "none";
}

function openLpModal(title, text, label, value, onSave) {
    const overlay = document.getElementById("lpOverlay");
    const titleEl = document.getElementById("lpModalTitle");
    const textEl = document.getElementById("lpModalText");
    const inputArea = document.getElementById("lpModalInputArea");
    const labelEl = document.getElementById("lpModalLabel");
    const input = document.getElementById("lpModalInput");
    const saveBtn = document.getElementById("lpModalSave");

    titleEl.textContent = title;
    textEl.textContent = text || "";
    labelEl.textContent = label || "";
    input.value = value || "";

    inputArea.style.display = label ? "block" : "none";
    saveBtn.textContent = "Save";

    saveBtn.onclick = function () {
        if (onSave) {
            onSave(input.value.trim());
        }
    };

    overlay.style.display = "flex";

    if (label) {
        setTimeout(() => input.focus(), 100);
    }
} 
    

    function logout() {
      const confirmed = confirm("Are you sure you want to log out?");

      if (confirmed) {
        localStorage.removeItem("lonerpay_access_token");
        localStorage.removeItem("lonerpay_refresh_token");
        window.location.href = "index.html";
      }
    }    
async function loadProfile() {
  const accessToken = localStorage.getItem("lonerpay_access_token");

  if (!accessToken) {
    window.location.href = "index.html";
    return;
  }

  try {
    const response = await fetch("/api/profile", {
      method: "GET",
      headers: {
        Authorization: `Bearer ${accessToken}`
      },
      cache: "no-store"
    });

    const data = await response.json();

    if (response.status === 401) {
      localStorage.removeItem("lonerpay_access_token");
      localStorage.removeItem("lonerpay_refresh_token");
      window.location.href = "index.html";
      return;
    }

    if (!response.ok) {
      throw new Error(data.error || "Could not load profile");
    }

    const name = data.name || "LonerPay User";
    const phone = data.phone || "Manage your account and security";

    document.querySelector(".profile-card h2").textContent = name;
    document.querySelector(".profile-card p").textContent = phone;
    document.querySelector(".avatar").textContent =
      name.charAt(0).toUpperCase();

  } catch (error) {
    console.error("Profile load error:", error);
  }
} 
    async function editProfile() {
  const accessToken = localStorage.getItem("lonerpay_access_token");

  if (!accessToken) {
    window.location.href = "index.html";
    return;
  }

  const currentName =
    document.querySelector(".profile-card h2").textContent;

  const currentPhone =
    document.querySelector(".profile-card p").textContent;

  openLpModal(
  "Personal Information",
  "Update your LonerPay profile details.",
  "Full name",
  "",
  async function(name) {
    if (!name) return;

    openLpModal(
      "Phone Number",
      "Enter the phone number linked to your LonerPay account.",
      "Phone number",
      "",
      async function(phone) {
        if (!phone) return; 

  try {
    const response = await fetch("/api/profile", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${accessToken}`
      },
      body: JSON.stringify({
        name: name.trim(),
        phone: phone.trim()
      })
    });

    const data = await response.json();

    if (response.status === 401) {
      localStorage.removeItem("lonerpay_access_token");
      localStorage.removeItem("lonerpay_refresh_token");
      window.location.href = "index.html";
      return;
    }

    if (!response.ok) {
      alert(data.error || "Could not save profile");
      return;
    }

    await loadProfile();
    alert("Personal information saved successfully.");

  } catch (error) {
    alert("Could not save profile. Please try again.");
  }

  
    } 

    document.querySelector(".menu button").onclick = editProfile;
    loadProfile();

    async function securitySettings() {
      const accessToken = localStorage.getItem("lonerpay_access_token");
      if (!accessToken) {
        alert("Please log in again to manage your payment PIN.");
        window.location.href = "index.html";
        return;
      }

      try {
        const statusResponse = await fetch("/api/pin", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${accessToken}`
          },
          body: JSON.stringify({ action: "status" })
        });
        const status = await statusResponse.json();
        if (!statusResponse.ok) throw new Error(status.error || "Could not load PIN settings");
        showPinForm(status.has_pin);
      } catch (error) {
        alert(error.message);
      }
    }

    function showPinForm(hasPin) {
      const overlay = document.createElement("div");
      overlay.className = "pin-overlay";
      overlay.innerHTML = `
        <div class="pin-card">
          <h2 style="margin-top:0;">${hasPin ? "Change Payment PIN" : "Create Payment PIN"}</h2>
          <p style="color:#6b7280;">Use exactly four digits. Never share this PIN with anyone.</p>
          ${hasPin ? `<label>Current PIN</label><input id="currentPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">` : ""}
          <label>New PIN</label>
          <input id="newPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
          <label>Confirm new PIN</label>
          <input id="confirmPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
          <button class="pin-primary" id="savePin">${hasPin ? "Change PIN" : "Create PIN"}</button>
          <button class="pin-cancel" id="cancelPin">Cancel</button>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector("#cancelPin").onclick = () => overlay.remove();
      overlay.querySelector("#savePin").onclick = async event => {
        const button = event.currentTarget;
        const newPin = overlay.querySelector("#newPin").value;
        const confirmedPin = overlay.querySelector("#confirmPin").value;
        const currentPin = hasPin ? overlay.querySelector("#currentPin").value : "";
        if (!/^\d{4}$/.test(newPin)) return alert("PIN must contain exactly 4 digits.");
        if (newPin !== confirmedPin) return alert("The new PIN entries do not match.");
        if (hasPin && !/^\d{4}$/.test(currentPin)) return alert("Enter your current 4-digit PIN.");

        button.disabled = true;
        button.textContent = "Saving...";
        try {
          const response = await fetch("/api/pin", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${localStorage.getItem("lonerpay_access_token")}`
            },
            body: JSON.stringify({
              action: hasPin ? "change" : "set",
              pin: newPin,
              current_pin: currentPin
            })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Could not save payment PIN");
          overlay.remove();
          alert(data.message);
        } catch (error) {
          alert(error.message);
          button.disabled = false;
          button.textContent = hasPin ? "Change PIN" : "Create PIN";
        }
      };
    }

    function updateNotificationButton() {
      const enabled =
        localStorage.getItem("lonerpayNotifications") === "enabled";

      const buttons = document.querySelectorAll(".menu button");
      buttons[2].textContent =
        enabled ? "🔔 Notifications: ON" : "🔕 Notifications: OFF";
    }

    function toggleNotifications() {
      const enabled =
        localStorage.getItem("lonerpayNotifications") === "enabled";

      localStorage.setItem(
        "lonerpayNotifications",
        enabled ? "disabled" : "enabled"
      );

      updateNotificationButton();

      alert(
        enabled
          ? "Notifications have been turned off."
          : "Notifications have been turned on."
      );
    }

    function contactSupport() {
      const message = encodeURIComponent(
        "Hello LonerPay Support, I need assistance with my account."
      );

      window.location.href =
        "https://wa.me/2349131123780?text=" + message;
    }

    updateNotificationButton(); 
  </script>
</body>
</html>
