<!DOCTYPE html>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
      background: #f5f7fb;
      color: #111827;
    }

    .header {
  background: linear-gradient(135deg, #071b33, #0b2f55);
  color: white;
  padding: 24px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom-left-radius: 24px;
  border-bottom-right-radius: 24px;
    } 

    .back {
      color: white;
      text-decoration: none;

    }

    .header h1 {
      margin: 0;

    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .profile-card {
  background: linear-gradient(145deg, #ffffff, #f8fbff);
  border-radius: 22px;
  padding: 30px 20px;
  text-align: center;
  border: 1px solid #eef2f7;
  box-shadow: 0 10px 30px rgba(17, 24, 39, 0.10);
  margin-bottom: 22px;
    } 

    .avatar {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #071b33, #0b2f55); 
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: bold;

    .profile-card h2 {

      background: white;
      border-radius: 18px;

    }

    .menu button {
      width: 100%;
      border: none;
      border-bottom: 1px solid #e5e7eb;

      padding: 18px;

      font-size: 16px;

    .logout {

      font-weight: bold;
    }

    .version {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      margin-top: 25px;
    }

    .pin-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.65);
    }

    .pin-card {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 20px;
      background: white;
    }

    .pin-card input {
      width: 100%;
      padding: 13px;
      margin: 7px 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 18px;
      letter-spacing: 8px;
      text-align: center;
    }

    .pin-primary, .pin-cancel {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      font-size: 16px;
    }

    .pin-primary { background: #111827; color: white; font-weight: bold; }
    .pin-cancel { margin-top: 7px; background: transparent; }
    
    /* Professional LonerPay popup + notification */
.lp-overlay {
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
}

.lp-modal {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.lp-modal h2 {
    margin: 0 0 8px;
    color: #111827;
    font-size: 24px;
}

.lp-modal p {
    margin: 0 0 20px;
    color: #6b7280;
    line-height: 1.5;
}

.lp-modal label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #111827;
}

.lp-modal input {
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

.lp-modal input:focus {
    border-color: #0b8f45;
}

.lp-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.lp-actions button {
    flex: 1;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
}

.lp-cancel {
    background: #f3f4f6;
    color: #374151;
}

.lp-save {
    background: #0b8f45;
    color: white;
}

.lp-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translate(-50%, -120px);
    width: calc(100% - 40px);
    max-width: 420px;
    background: #111827;
    color: white;
    padding: 16px 18px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
    z-index: 10000;
    opacity: 0;
    transition: .3s ease;
}

.lp-toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
} 
  </style>
</head>

<script> 
  function showMessage(message) {
    const toast = document.getElementById("lpToast");
    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}

function closeLpModal() {
    document.getElementById("lpOverlay").style.display = "none";
}

function openLpModal(title, text, label, value, onSave) {
    const overlay = document.getElementById("lpOverlay");
    const titleEl = document.getElementById("lpModalTitle");
    const textEl = document.getElementById("lpModalText");
    const inputArea = document.getElementById("lpModalInputArea");
    const labelEl = document.getElementById("lpModalLabel");
    const input = document.getElementById("lpModalInput");
    const saveBtn = document.getElementById("lpModalSave");

    titleEl.textContent = title;
    textEl.textContent = text || "";
    labelEl.textContent = label || "";
    input.value = value || "";

    inputArea.style.display = label ? "block" : "none";
    saveBtn.textContent = "Save";

    saveBtn.onclick = function () {
        if (onSave) {
            onSave(input.value.trim());
        }
    };

    overlay.style.display = "flex";

    if (label) {
        setTimeout(() => input.focus(), 100);
    }
} 
    

    function logout() {
      const confirmed = confirm("Are you sure you want to log out?");

      if (confirmed) {
        localStorage.removeItem("lonerpay_access_token");
        localStorage.removeItem("lonerpay_refresh_token");
        window.location.href = "index.html";
      }
    }    
async function loadProfile() {
  const accessToken = localStorage.getItem("lonerpay_access_token");

  if (!accessToken) {
    window.location.href = "index.html";
    return;
  }

  try {
    const response = await fetch("/api/profile", {
      method: "GET",
      headers: {
        Authorization: `Bearer ${accessToken}`
      },
      cache: "no-store"
    });

    const data = await response.json();

    if (response.status === 401) {
      localStorage.removeItem("lonerpay_access_token");
      localStorage.removeItem("lonerpay_refresh_token");
      window.location.href = "index.html";
      return;
    }

    if (!response.ok) {
      throw new Error(data.error || "Could not load profile");
    }

    const name = data.name || "LonerPay User";
    const phone = data.phone || "Manage your account and security";

    document.querySelector(".profile-card h2").textContent = name;
    document.querySelector(".profile-card p").textContent = phone;
    document.querySelector(".avatar").textContent =
      name.charAt(0).toUpperCase();

  } catch (error) {
    console.error("Profile load error:", error);
  }
} 
    async function editProfile() {
  const accessToken = localStorage.getItem("lonerpay_access_token");

  if (!accessToken) {
    window.location.href = "index.html";
    return;
  }

  const currentName =
    document.querySelector(".profile-card h2").textContent;

  const currentPhone =
    document.querySelector(".profile-card p").textContent;

  openLpModal(
  "Personal Information",
  "Update your LonerPay profile details.",
  "Full name",
  "",
  async function(name) {
    if (!name) return;

    openLpModal(
      "Phone Number",
      "Enter the phone number linked to your LonerPay account.",
      "Phone number",
      "",
      async function(phone) {
        if (!phone) return; 

  try {
    const response = await fetch("/api/profile", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${accessToken}`
      },
      body: JSON.stringify({
        name: name.trim(),
        phone: phone.trim()
      })
    });

    const data = await response.json();

    if (response.status === 401) {
      localStorage.removeItem("lonerpay_access_token");
      localStorage.removeItem("lonerpay_refresh_token");
      window.location.href = "index.html";
      return;
    }

    if (!response.ok) {
      alert(data.error || "Could not save profile");
      return;
    }

    await loadProfile();
    alert("Personal information saved successfully.");

  } catch (error) {
  alert("Could not save profile. Please try again.");
}

      }
    );
  }
);
}

document.querySelector(".menu button").onclick = editProfile; 
  
    loadProfile();

    async function securitySettings() {
      const accessToken = localStorage.getItem("lonerpay_access_token");
      if (!accessToken) {
        alert("Please log in again to manage your payment PIN.");
        window.location.href = "index.html";
        return;
      }

      try {
        const statusResponse = await fetch("/api/pin", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${accessToken}`
          },
          body: JSON.stringify({ action: "status" })
        });
        const status = await statusResponse.json();
        if (!statusResponse.ok) throw new Error(status.error || "Could not load PIN settings");
        showPinForm(status.has_pin);
      } catch (error) {
        alert(error.message);
      }
    }

    function showPinForm(hasPin) {
      const overlay = document.createElement("div");
      overlay.className = "pin-overlay";
      overlay.innerHTML = `
        <div class="pin-card">
          <h2 style="margin-top:0;">${hasPin ? "Change Payment PIN" : "Create Payment PIN"}</h2>
          <p style="color:#6b7280;">Use exactly four digits. Never share this PIN with anyone.</p>
          ${hasPin ? `<label>Current PIN</label><input id="currentPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">` : ""}
          <label>New PIN</label>
          <input id="newPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
          <label>Confirm new PIN</label>
          <input id="confirmPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
          <button class="pin-primary" id="savePin">${hasPin ? "Change PIN" : "Create PIN"}</button>
          <button class="pin-cancel" id="cancelPin">Cancel</button>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector("#cancelPin").onclick = () => overlay.remove();
      overlay.querySelector("#savePin").onclick = async event => {
        const button = event.currentTarget;
        const newPin = overlay.querySelector("#newPin").value;
        const confirmedPin = overlay.querySelector("#confirmPin").value;
        const currentPin = hasPin ? overlay.querySelector("#currentPin").value : "";
        if (!/^\d{4}$/.test(newPin)) return alert("PIN must contain exactly 4 digits.");
        if (newPin !== confirmedPin) return alert("The new PIN entries do not match.");
        if (hasPin && !/^\d{4}$/.test(currentPin)) return alert("Enter your current 4-digit PIN.");

        button.disabled = true;
        button.textContent = "Saving...";
        try {
          const response = await fetch("/api/pin", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${localStorage.getItem("lonerpay_access_token")}`
            },
            body: JSON.stringify({
              action: hasPin ? "change" : "set",
              pin: newPin,
              current_pin: currentPin
            })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Could not save payment PIN");
          overlay.remove();
          alert(data.message);
        } catch (error) {
          alert(error.message);
          button.disabled = false;
          button.textContent = hasPin ? "Change PIN" : "Create PIN";
        }
      };
    }

    function updateNotificationButton() {
      const enabled =
        localStorage.getItem("lonerpayNotifications") === "enabled";

      const buttons = document.querySelectorAll(".menu button");
      buttons[2].textContent =
        enabled ? "🔔 Notifications: ON" : "🔕 Notifications: OFF";
    }

    function toggleNotifications() {
      const enabled =
        localStorage.getItem("lonerpayNotifications") === "enabled";

      localStorage.setItem(
        "lonerpayNotifications",
        enabled ? "disabled" : "enabled"
      );

      updateNotificationButton();

      alert(
        enabled
          ? "Notifications have been turned off."
          : "Notifications have been turned on."
      );
    }

    function contactSupport() {
      const message = encodeURIComponent(
        "Hello LonerPay Support, I need assistance with my account."
      );

      window.location.href =
        "https://wa.me/2349131123780?text=" + message;
    }

    updateNotificationButton(); 
  </script>

};
window.lpKyc=async function(){
  const o=S('KYC & Verification',`<div class="lp-hero"><h3>Protect your identity</h3><p>Verification helps protect accounts, reduce fraud and meet payment-provider requirements.</p></div><div class="lp-ch"><h3>Verification status</h3><div class="lp-row"><span>Current status</span><strong><span class="lp-status" id="lpKycStatus">Checking…</span></strong></div><div class="lp-row"><span>BVN</span><strong>Never displayed in full</strong></div><div class="lp-row"><span>Virtual account</span><strong id="lpKycVa">Checking…</strong></div></div><div class="lp-ch"><h3>How verification works</h3><ul class="lp-list"><li>Confirm identity through the approved verification flow.</li><li>Collect only information required for KYC.</li><li>Never expose a full BVN, PIN, password or OTP.</li><li>Show Verified, Pending or Action Required only when the backend confirms it.</li></ul></div><div class="lp-ch"><h3>Verification limits</h3><p>Wallet and transaction limits will be displayed only after LonerPay's final KYC tiers and provider requirements are configured.</p></div><button class="lp-primary" id="lpKycAction">Check / complete verification</button>`);
  const statusEl=o.querySelector('#lpKycStatus'), vaEl=o.querySelector('#lpKycVa'), action=o.querySelector('#lpKycAction');
  action.onclick=()=>{o.remove();lpKycForm()};
  const token=localStorage.getItem('lonerpay_access_token');
  if(!token){statusEl.textContent='Login required';vaEl.textContent='Unavailable';action.textContent='Log in again';action.onclick=()=>location.href='index.html';return;}
  try{
    const r=await fetch('/api/kyc/status',{method:'GET',headers:{Authorization:`Bearer ${token}`},cache:'no-store'});
    const d=await r.json();
    if(r.status===401){localStorage.removeItem('lonerpay_access_token');localStorage.removeItem('lonerpay_refresh_token');statusEl.textContent='Session expired';vaEl.textContent='Unavailable';action.textContent='Log in again';action.onclick=()=>location.href='index.html';return;}
    if(!r.ok||!d.success)throw new Error(d.error||'Unable to check verification status');
    const labels={not_verified:'Not Verified',pending:'Verification in Progress',verified:'Verified',action_required:'Action Required'};
    statusEl.textContent=labels[d.status]||'Verification in Progress';
    const vaReady = !!(d.account_number && (d.virtual_account_ready || d.assignment_status === 'assigned' || d.assignment_status === 'identification_success'));
    vaEl.textContent=vaReady?(d.bank_name?`Ready · ${d.bank_name}`:'Ready'):'Not ready';
    if(d.status==='verified'){
      if(vaReady){action.textContent='View Virtual Account';action.onclick=()=>{o.remove();lpAccount()};}
      else {action.textContent='Verification complete · Account pending';action.disabled=true;action.style.opacity='.65';action.style.cursor='default';}
    }
    else if(d.status==='pending'){action.textContent='View Verification Progress';}
    else if(d.status==='action_required'){action.textContent='Review / Retry Verification';}
  }catch(e){console.error('KYC status load error:',e);statusEl.textContent='Unable to check';vaEl.textContent='Unavailable';action.textContent='Try again';action.onclick=()=>{o.remove();lpKyc()};}
};
window.lpKycForm=async function(){
  const token=localStorage.getItem('lonerpay_access_token');
  if(!token){location.href='index.html';return;}
  try{
    const sr=await fetch('/api/kyc/status',{method:'GET',headers:{Authorization:`Bearer ${token}`},cache:'no-store'});
    const sd=await sr.json();
    if(sr.status===401){localStorage.removeItem('lonerpay_access_token');localStorage.removeItem('lonerpay_refresh_token');location.href='index.html';return;}
    if(sr.ok && sd.success && sd.account_number && (sd.virtual_account_ready || sd.assignment_status === 'assigned' || sd.assignment_status === 'identification_success')){lpAccount();return;}
    if(sr.ok && sd.success && (sd.status==='pending' || sd.status==='verified')){N(sd.status==='verified'?'Verification complete':'Verification in progress',sd.status==='verified'?'Your identity is already verified. Your dedicated virtual account is being finalized; you do not need to enter your BVN or bank details again.':'Your verification has already been submitted. Please wait for provider confirmation.','🛡️');return;}
  }catch(e){console.error('KYC pre-check error:',e);}
  const o=S('Identity Verification',`<div class="lp-hero"><h3>Verify securely</h3><p>Enter details that belong to you. Your BVN is sent securely to the verification backend and is cleared from this form after submission.</p></div><div class="lp-ch"><label style="font-weight:800;display:block;margin-bottom:7px">BVN</label><input id="kycBvn" type="password" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="11-digit BVN" style="width:100%;padding:15px;border:1px solid #dce5f0;border-radius:13px;font-size:16px;box-sizing:border-box"><label style="font-weight:800;display:block;margin:16px 0 7px">Bank linked to your BVN</label><select id="kycBank" style="width:100%;padding:15px;border:1px solid #dce5f0;border-radius:13px;font-size:16px;background:#fff;box-sizing:border-box"><option value="">Select bank</option><option value="044">Access Bank</option><option value="058">GTBank</option><option value="033">United Bank for Africa (UBA)</option><option value="011">First Bank of Nigeria</option><option value="057">Zenith Bank</option><option value="032">Union Bank</option><option value="035">Wema Bank</option><option value="221">Stanbic IBTC Bank</option><option value="232">Sterling Bank</option><option value="214">First City Monument Bank (FCMB)</option><option value="50515">Moniepoint MFB</option><option value="999992">OPay</option><option value="999991">PalmPay</option></select><label style="font-weight:800;display:block;margin:16px 0 7px">Bank account number</label><input id="kycAcct" type="tel" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="10-digit account number" style="width:100%;padding:15px;border:1px solid #dce5f0;border-radius:13px;font-size:16px;box-sizing:border-box"><label style="display:flex;gap:10px;align-items:flex-start;margin-top:18px;color:#5f6f84;line-height:1.45"><input id="kycConsent" type="checkbox" style="margin-top:3px"> <span>I consent to LonerPay using these details only as required to verify my identity and process my virtual-account request through its payment provider.</span></label><div id="kycErr" style="color:#b42318;font-weight:700;font-size:13px;margin-top:13px"></div></div><div class="lp-note">Never share your BVN, OTP, password or payment PIN with anyone. LonerPay does not display your BVN after submission.</div><button class="lp-primary" id="kycSubmit">Verify & Continue</button>`);
  const b=o.querySelector('#kycSubmit'),err=o.querySelector('#kycErr'),bvn=o.querySelector('#kycBvn'),acct=o.querySelector('#kycAcct'),bank=o.querySelector('#kycBank'),cons=o.querySelector('#kycConsent');
  b.onclick=async()=>{
    const bv=bvn.value.replace(/\D/g,''),an=acct.value.replace(/\D/g,''),bc=bank.value;
    err.textContent='';
    if(!/^\d{11}$/.test(bv)){err.textContent='Enter your valid 11-digit BVN.';return;}
    if(!bc){err.textContent='Select the bank linked to your BVN.';return;}
    if(!/^\d{10}$/.test(an)){err.textContent='Enter your valid 10-digit bank account number.';return;}
    if(!cons.checked){err.textContent='Please give consent before continuing.';return;}
    b.disabled=true;
    b.innerHTML='<span class="lp-spin" aria-hidden="true"></span>Verifying securely…';
    b.style.opacity='.78';
    b.style.cursor='wait';
    b.setAttribute('aria-busy','true');
    bvn.disabled=true;acct.disabled=true;bank.disabled=true;cons.disabled=true;
    try{
      const r=await fetch('/api/virtual-account',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({bvn:bv,account_number:an,bank_code:bc,consent:true})});
      const d=await r.json().catch(()=>({}));
      bvn.value='';acct.value='';
      if(r.status===401){localStorage.removeItem('lonerpay_access_token');localStorage.removeItem('lonerpay_refresh_token');location.href='index.html';return;}
      if(!r.ok||d.success===false)throw new Error(d.message||d.error||'Unable to submit verification.');
      o.remove();
      N('Verification submitted',d.message||'Your verification request was submitted. Paystack confirmation may take a moment. Check your KYC status again shortly.','🛡️');
    }catch(e){
      bvn.value='';
      err.textContent=e.message||'Unable to submit verification.';
      b.disabled=false;
      b.textContent='Verify & Continue';
      b.style.opacity='1';
      b.style.cursor='pointer';
      b.removeAttribute('aria-busy');
      bvn.disabled=false;acct.disabled=false;bank.disabled=false;cons.disabled=false;
    }
  };
};
window.lpBio=()=>S('Biometrics & Login',`<div class="lp-hero"><h3>Fast login. Secure device.</h3><p>Use supported device authentication for faster access without storing a fingerprint or face image as a password.</p></div><div class="lp-ch"><h3>Device authentication</h3><div class="lp-row"><span>Fingerprint / Face</span><strong><span class="lp-status">Not configured</span></strong></div><div class="lp-row"><span>Payment PIN</span><strong>Managed separately</strong></div><div class="lp-row"><span>Device support</span><strong>Checked during setup</strong></div></div><div class="lp-ch"><h3>Security</h3><p>On supported devices, authentication should be handled by the operating system or a secure standards-based credential. LonerPay should not store raw fingerprint or face images.</p></div><div class="lp-note">Actual biometric login must be connected and tested securely before this can be marked active.</div><button class="lp-primary" onclick="lpNotice('Biometric setup','Secure device authentication still needs to be connected before activation.','◉')">Set up biometrics</button>`);

window.lpPrivacy=function(){let o=S('Privacy & Legal',`<div class="lp-hero"><h3>Your information matters</h3><p>Understand how LonerPay intends to handle account information, security and rules for using the service.</p></div><div class="lp-nav"><button data-p="p">Privacy Policy</button><button data-p="t">Terms & Conditions</button><button data-p="s">Data & Security</button><button data-p="c">Your Controls</button></div><div id="pb"></div><div class="lp-note">These are product drafts for the app experience and should receive final Nigerian legal/compliance review before public launch.</div>`);let b=o.querySelector('#pb'),p={p:`<div class="lp-ch"><h3>Privacy Policy</h3><p>LonerPay is designed to use personal information for operating accounts, processing supported payments, protecting customers, providing support and meeting applicable verification or legal obligations.</p></div><div class="lp-ch"><h3>Information we may need</h3><ul class="lp-list"><li>Name, email and phone number.</li><li>Identity or verification information when required.</li><li>Transaction and wallet records needed to provide services.</li><li>Security and device information used to protect account access.</li></ul></div><div class="lp-ch"><h3>Service providers</h3><p>Information should be shared only where necessary with payment, bill-payment, verification, infrastructure or regulatory partners, or where disclosure is legally required.</p></div>`,t:`<div class="lp-ch"><h3>Terms & Conditions</h3><p>Customers should use LonerPay only for lawful transactions and provide accurate account information. Access may be restricted for security, fraud prevention, provider requirements or legal compliance.</p></div><div class="lp-ch"><h3>Payments & wallet</h3><p>Transactions may be successful, pending, failed, reversed or refunded depending on provider confirmation. Transaction records should reflect the final confirmed status.</p></div><div class="lp-ch"><h3>Customer responsibility</h3><p>Protect passwords, OTPs and payment PINs, review recipient details before confirming payments, and report suspicious activity promptly.</p></div>`,s:`<div class="lp-ch"><h3>Data & Security</h3><p>LonerPay should use authenticated server-side payment flows, protected credentials, access controls and transaction records to reduce unauthorized activity.</p></div><div class="lp-ch"><h3>Never share</h3><ul class="lp-list"><li>Your password.</li><li>Your OTP with support staff.</li><li>Your payment PIN in chat or social media.</li><li>Secret API credentials or private security keys.</li></ul></div>`,c:`<div class="lp-ch"><h3>Your account controls</h3><p>Customers should be able to review appropriate profile information, control supported notifications, request support and request account closure subject to balances, disputes and legal retention requirements.</p></div><div class="lp-ch"><h3>Privacy requests</h3><p>A dedicated privacy/support contact should be published before launch for appropriate data or account requests.</p></div>`};let show=k=>b.innerHTML=p[k];o.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>show(x.dataset.p));show('p')};
window.lpClose=()=>S('Close Account',`<div class="lp-hero"><h3>Account closure</h3><p>Closing a financial account is sensitive and should require secure authentication and backend checks.</p></div><div class="lp-ch"><h3>Before closing</h3><ul class="lp-list"><li>Confirm the authenticated customer.</li><li>Check wallet balance and pending transactions.</li><li>Resolve applicable refunds or disputes.</li><li>Apply required record-retention rules.</li></ul></div><div class="lp-note">This screen does not delete an account until a secure server-side closure flow is implemented.</div><button class="lp-red" onclick="lpNotice('Account closure','Secure account-closure processing still needs to be connected to the backend.','⚠')">Request account closure</button>`);
