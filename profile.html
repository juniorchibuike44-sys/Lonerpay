<script> 
  function showMessage(message) {
    const toast = document.getElementById("lpToast");
    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}

function closeLpModal() {
    document.getElementById("lpOverlay").style.display = "none";
}

function openLpModal(title, text, label, value, onSave) {
    const overlay = document.getElementById("lpOverlay");
    const titleEl = document.getElementById("lpModalTitle");
    const textEl = document.getElementById("lpModalText");
    const inputArea = document.getElementById("lpModalInputArea");
    const labelEl = document.getElementById("lpModalLabel");
    const input = document.getElementById("lpModalInput");
    const saveBtn = document.getElementById("lpModalSave");

    titleEl.textContent = title;
    textEl.textContent = text || "";
    labelEl.textContent = label || "";
    input.value = value || "";

    inputArea.style.display = label ? "block" : "none";
    saveBtn.textContent = "Save";

    saveBtn.onclick = function () {
        if (onSave) {
            onSave(input.value.trim());
        }
    };

    overlay.style.display = "flex";

    if (label) {
        setTimeout(() => input.focus(), 100);
    }
} 
    

    function logout() {
      const confirmed = confirm("Are you sure you want to log out?");

      if (confirmed) {
        localStorage.removeItem("lonerpay_access_token");
        localStorage.removeItem("lonerpay_refresh_token");
        window.location.href = "index.html";
      }
    }    
async function loadProfile() {
  const accessToken = localStorage.getItem("lonerpay_access_token");

  if (!accessToken) {
    window.location.href = "index.html";
    return;
  }

  try {
    const response = await fetch("/api/profile", {
      method: "GET",
      headers: {
        Authorization: `Bearer ${accessToken}`
      },
      cache: "no-store"
    });

    const data = await response.json();

    if (response.status === 401) {
      localStorage.removeItem("lonerpay_access_token");
      localStorage.removeItem("lonerpay_refresh_token");
      window.location.href = "index.html";
      return;
    }

    if (!response.ok) {
      throw new Error(data.error || "Could not load profile");
    }

    window.lpCurrentProfile = data;
    document.getElementById("lpProfileEmail").textContent = data.email || "";
    const name = data.name || "LonerPay User";
    const phone = data.phone || "Manage your account and security";

    document.querySelector(".profile-card h2").textContent = name;
    document.querySelector(".profile-card p").textContent = phone;
    document.querySelector(".avatar").textContent =
      name.charAt(0).toUpperCase();

  } catch (error) {
    console.error("Profile load error:", error);
  }
}

    async function securitySettings() {
      const accessToken = localStorage.getItem("lonerpay_access_token");
      if (!accessToken) {
        alert("Please log in again to manage your payment PIN.");
        window.location.href = "index.html";
        return;
      }

      try {
        const statusResponse = await fetch("/api/pin", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${accessToken}`
          },
          body: JSON.stringify({ action: "status" })
        });
        const status = await statusResponse.json();
        if (!statusResponse.ok) throw new Error(status.error || "Could not load PIN settings");
        showPinForm(status.has_pin);
      } catch (error) {
        alert(error.message);
      }
    }

    function showPinForm(hasPin) {
      const overlay = document.createElement("div");
      overlay.className = "pin-overlay";
      overlay.innerHTML = `
        <div class="pin-card">
          <h2 style="margin-top:0;">${hasPin ? "Change Payment PIN" : "Create Payment PIN"}</h2>
          <p style="color:#6b7280;">Use exactly four digits. Never share this PIN with anyone.</p>
          ${hasPin ? `<label>Current PIN</label><input id="currentPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">` : ""}
          <label>New PIN</label>
          <input id="newPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
          <label>Confirm new PIN</label>
          <input id="confirmPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
          <button class="pin-primary" id="savePin">${hasPin ? "Change PIN" : "Create PIN"}</button>
          <button class="pin-cancel" id="cancelPin">Cancel</button>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector("#cancelPin").onclick = () => overlay.remove();
      overlay.querySelector("#savePin").onclick = async event => {
        const button = event.currentTarget;
        const newPin = overlay.querySelector("#newPin").value;
        const confirmedPin = overlay.querySelector("#confirmPin").value;
        const currentPin = hasPin ? overlay.querySelector("#currentPin").value : "";
        if (!/^\d{4}$/.test(newPin)) return alert("PIN must contain exactly 4 digits.");
        if (newPin !== confirmedPin) return alert("The new PIN entries do not match.");
        if (hasPin && !/^\d{4}$/.test(currentPin)) return alert("Enter your current 4-digit PIN.");

        button.disabled = true;
        button.textContent = "Saving...";
        try {
          const response = await fetch("/api/pin", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${localStorage.getItem("lonerpay_access_token")}`
            },
            body: JSON.stringify({
              action: hasPin ? "change" : "set",
              pin: newPin,
              current_pin: currentPin
            })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Could not save payment PIN");
          overlay.remove();
          alert(data.message);
        } catch (error) {
          alert(error.message);
          button.disabled = false;
          button.textContent = hasPin ? "Change PIN" : "Create PIN";
        }
      };
    }

    function updateNotificationButton() {
      const enabled =
        localStorage.getItem("lonerpayNotifications") === "enabled";

      const buttons = document.querySelectorAll(".menu button");
      buttons[2].textContent =
        enabled ? "🔔 Notifications: ON" : "🔕 Notifications: OFF";
    }

    function toggleNotifications() {
      const enabled =
        localStorage.getItem("lonerpayNotifications") === "enabled";

      localStorage.setItem(
        "lonerpayNotifications",
        enabled ? "disabled" : "enabled"
      );

      updateNotificationButton();

      alert(
        enabled
          ? "Notifications have been turned off."
          : "Notifications have been turned on."
      );
    }

    function contactSupport() {
      if (typeof window.lpSupport === "function") return window.lpSupport();
      window.location.href = "https://wa.me/2349131123780?text=" + encodeURIComponent("Hello LonerPay Support, I need assistance with my account.");
    }

    updateNotificationButton();

window.lpKyc=async function(){
  const o=S('KYC & Verification',`<div class="lp-hero"><h3>Protect your identity</h3><p>Verification helps protect accounts, reduce fraud and meet payment-provider requirements.</p></div><div class="lp-ch"><h3>Verification status</h3><div class="lp-row"><span>Current status</span><strong><span class="lp-status" id="lpKycStatus">Checking…</span></strong></div><div class="lp-row"><span>BVN</span><strong>Never displayed in full</strong></div><div class="lp-row"><span>Virtual account</span><strong id="lpKycVa">Checking…</strong></div></div><div class="lp-ch"><h3>How verification works</h3><ul class="lp-list"><li>Confirm identity through the approved verification flow.</li><li>Collect only information required for KYC.</li><li>Never expose a full BVN, PIN, password or OTP.</li><li>Show Verified, Pending or Action Required only when the backend confirms it.</li></ul></div><div class="lp-ch"><h3>Verification limits</h3><p>Wallet and transaction limits will be displayed only after LonerPay's final KYC tiers and provider requirements are configured.</p></div><button class="lp-primary" id="lpKycAction">Check / complete verification</button>`);
  const statusEl=o.querySelector('#lpKycStatus'), vaEl=o.querySelector('#lpKycVa'), action=o.querySelector('#lpKycAction');
  action.onclick=()=>{o.remove();lpKycForm()};
  const token=localStorage.getItem('lonerpay_access_token');
  if(!token){statusEl.textContent='Login required';vaEl.textContent='Unavailable';action.textContent='Log in again';action.onclick=()=>location.href='index.html';return;}
  try{
    const r=await fetch('/api/kyc/status',{method:'GET',headers:{Authorization:`Bearer ${token}`},cache:'no-store'});
    const d=await r.json();
    if(r.status===401){localStorage.removeItem('lonerpay_access_token');localStorage.removeItem('lonerpay_refresh_token');statusEl.textContent='Session expired';vaEl.textContent='Unavailable';action.textContent='Log in again';action.onclick=()=>location.href='index.html';return;}
    if(!r.ok||!d.success)throw new Error(d.error||'Unable to check verification status');
    const labels={not_verified:'Not Verified',pending:'Verification in Progress',verified:'Verified',action_required:'Action Required'};
    statusEl.textContent=labels[d.status]||'Verification in Progress';
    const vaReady = !!(d.account_number && (d.virtual_account_ready || d.assignment_status === 'assigned' || d.assignment_status === 'identification_success'));
    vaEl.textContent=vaReady?(d.bank_name?`Ready · ${d.bank_name}`:'Ready'):'Not ready';

window.lpKycForm=async function(){

  }catch(e){console.error('KYC pre-check error:',e);}

ess my virtual-account request through its payment provider.</span></label><div id="kycErr" style="color:#b42318;font-weight:700;font-size:13px;margin-top:13px"></div></div><div class="lp-note">Never share your BVN, OTP, password or payment PIN with anyone. LonerPay does not display your BVN after submission.</div><button class="lp-primary" id="kycSubmit">Verify & Continue</button>`);
  const b=o.querySelector('#kycSubmit'),err=o.querySelector('#kycErr'),bvn=o.querySelector('#kycBvn'),acct=o.querySelector('#kycAcct'),bank=o.querySelector('#kycBank'),cons=o.querySelector('#kycConsent');
  b.onclick=async()=>{
    const bv=bvn.value.replace(/\D/g,''),an=acct.value.replace(/\D/g,''),bc=bank.value;

    if(!bc){err.textContent='Select the bank linked to your BVN.';return;}
    if(!/^\d{10}$/.test(an)){err.textContent='Enter your valid 10-digit bank account number.';return;}
    if(!cons.checked){err.textContent='Please give consent before continuing.';return;}
    b.disabled=true;
    b.innerHTML='<span class="lp-spin" aria-hidden="true"></span>Verifying securely…';
    b.style.opacity='.78';
    b.style.cursor='wait';
    b.setAttribute('aria-busy','true');
    bvn.disabled=true;acct.disabled=true;bank.disabled=true;cons.disabled=true;
    try{
      const r=await fetch('/api/virtual-account',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({bvn:bv,account_number:an,bank_code:bc,consent:true})});
      const d=await r.json().catch(()=>({}));
      bvn.value='';acct.value='';
      if(r.status===401){localStorage.removeItem('lonerpay_access_token');localStorage.removeItem('lonerpay_refresh_token');location.href='index.html';return;}
      if(!r.ok||d.success===false)throw new Error(d.message||d.error||'Unable to submit verification.');
      o.remove();
      N('Verification submitted',d.message||'Your verification request was submitted. Paystack confirmation may take a moment. Check your KYC status again shortly.','🛡️');
    }catch(e){
      bvn.value='';
      err.textContent=e.message||'Unable to submit verification.';
      b.disabled=false;
      b.textContent='Verify & Continue';
      b.style.opacity='1';
      b.style.cursor='pointer';
      b.removeAttribute('aria-busy');
      bvn.disabled=false;acct.disabled=false;bank.disabled=false;cons.disabled=false;
    }
  };
};
window.lpBio=async function(){
  const o=S('Biometrics & Login',`<div class="lp-hero"><h3>Unlock with your phone</h3><p>Set up a passkey for faster sign-in. Your phone may use fingerprint, face recognition or its screen-lock PIN.</p></div><div class="lp-ch"><h3>Registered passkeys</h3><div id="lpPasskeys">Checking your account…</div></div><div class="lp-note">Your fingerprint and face data stay with your device. Your four-digit payment PIN is still required for payments.</div><div id="lpBioError" role="status" style="color:#b42318;font-size:13px;margin-top:15px"></div><button class="lp-primary" id="lpBioRegister" disabled>Add a passkey</button>`);

  function message(e){return /notallowed|cancel|abort/i.test(String(e?.name)+' '+e?.message)?'Setup was cancelled. You can try again.':String(e?.message||'Unable to complete passkey setup.');}

        const yes=document.createElement('button');yes.textContent='Remove passkey';const no=document.createElement('button');no.textContent='Cancel';confirmRow.append(yes,no);row.after(confirmRow);button.disabled=true;
        no.onclick=()=>{confirmRow.remove();button.disabled=false;};
        yes.onclick=async()=>{yes.disabled=true;try{const {error}=await client.auth.passkey.delete({passkeyId:key.id});if(error)throw error;await list();}catch(e){err.textContent=message(e);yes.disabled=false;}};
      };
    }

  }

    user=data.session.user;syncSession(data.session);await list();add.disabled=false;
    add.onclick=async()=>{add.disabled=true;add.textContent='Follow your phone’s security prompt…';err.textContent='';
      try{const {error}=await client.auth.registerPasskey();if(error)throw error;const {data}=await client.auth.getSession();syncSession(data?.session);await list();err.style.color='#087745';err.textContent='Passkey registered. Use “Unlock with phone security” on the login page.';}
      catch(e){err.style.color='#b42318';err.textContent=message(e);}

    };
  }catch(e){box.textContent='Passkey status unavailable';err.textContent=message(e);}

window.lpRecovery=function(){let o=S('Recovery & Access',`<div class="lp-hero"><h3>Recover your account securely</h3><p>A password-reset link will be sent only to the email address registered to your logged-in account.</p></div><div class="lp-ch"><h3>Account recovery</h3><p>Use this if you have forgotten your password or believe somebody else knows it. After changing your password, log out other devices and review recent transactions.</p></div><div id="lpRecoveryError" style="min-height:20px;color:#b42318;font-size:13px;font-weight:700"></div><button class="lp-primary" id="lpRecoverySend">Send password-reset email</button><button class="lp-secondary" id="lpRecoveryLogout">Log out this device</button>`);o.querySelector('#lpRecoverySend').onclick=async e=>{const b=e.currentTarget,err=o.querySelector('#lpRecoveryError');b.disabled=true;b.textContent='Preparing secure reset…';try{const p=await fetch('/api/profile',{headers:{Authorization:`Bearer ${localStorage.getItem('lonerpay_access_token')||''}`},cache:'no-store'});const u=await p.json();if(!p.ok||!u.email)throw new Error('Could not confirm your registered email');const c=await fetch('/api/config',{cache:'no-store'});const cfg=await c.json();const r=await fetch(`${cfg.supabaseUrl}/auth/v1/recover`,{method:'POST',headers:{apikey:cfg.supabasePublishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:u.email})});if(!r.ok)throw new Error('Could not send the recovery email');b.textContent='Recovery email sent';err.style.color='#067647';err.textContent='Check your inbox and spam folder. The link expires for your protection.'}catch(x){err.textContent=x.message;b.disabled=false;b.textContent='Send password-reset email'}};o.querySelector('#lpRecoveryLogout').onclick=()=>window.lpLogout()};
window.lpClose=async function(){let o=S('Close Account',`<div class="lp-hero"><h3>Secure account closure</h3><p>LonerPay checks your wallet and pending transactions before accepting a closure request.</p></div><div class="lp-ch" id="lpCloseChecks"><strong>Checking your account…</strong></div>`);const token=localStorage.getItem('lonerpay_access_token')||'';try{const r=await fetch('/api/account-closure',{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not check account');const blocked=Number(d.balance)>0||d.has_pending_transactions;const previous=d.request;o.querySelector('#lpCloseChecks').innerHTML=`<div class="lp-row"><span>Wallet balance</span><strong>₦${Number(d.balance||0).toLocaleString(undefined,{minimumFractionDigits:2})}</strong></div><div class="lp-row"><span>Pending transactions</span><strong>${d.has_pending_transactions?'Yes':'None'}</strong></div>${previous?`<div class="lp-row"><span>Existing request</span><strong>${previous.status||'Pending review'} · ${previous.reference||''}</strong></div>`:''}${blocked?'<div class="lp-note">Use or withdraw your balance and wait for pending transactions before requesting closure.</div>':`<label style="font-weight:800;display:block;margin:16px 0 7px">Reason for leaving</label><textarea id="lpCloseReason" maxlength="500" rows="4" style="width:100%;padding:13px;border:1px solid #dce5f0;border-radius:13px;box-sizing:border-box" placeholder="Tell us why you want to close your account"></textarea><label style="font-weight:800;display:block;margin:16px 0 7px">Type CLOSE MY ACCOUNT</label><input id="lpCloseConfirm" autocomplete="off" style="width:100%;padding:13px;border:1px solid #dce5f0;border-radius:13px;box-sizing:border-box"><div id="lpCloseError" style="min-height:20px;color:#b42318;font-size:13px;font-weight:700;margin-top:9px"></div><button class="lp-red" id="lpCloseSubmit">Request account closure</button>`}`;const b=o.querySelector('#lpCloseSubmit');if(b)b.onclick=async()=>{const err=o.querySelector('#lpCloseError');b.disabled=true;b.textContent='Submitting…';try{const q=await fetch('/api/account-closure',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({reason:o.querySelector('#lpCloseReason').value,confirmation:o.querySelector('#lpCloseConfirm').value})});const z=await q.json();if(!q.ok)throw new Error(z.error||'Request failed');o.querySelector('#lpCloseChecks').innerHTML=`<div class="lp-hero"><h3>Request submitted</h3><p>Reference: <strong>${z.reference}</strong>. Your account remains accessible while the request is reviewed.</p></div>`}catch(x){err.textContent=x.message;b.disabled=false;b.textContent='Request account closure'}}}catch(x){o.querySelector('#lpCloseChecks').innerHTML=`<div class="lp-note">${x.message}</div>`}};
function updateN(){let r=document.getElementById('lpN');if(r){let on=localStorage.getItem('lonerpayNotifications')==='enabled';r.querySelector('.lp-label').lastChild.textContent=on?' Notifications: ON':' Notifications: OFF'}}

function U(){let old=document.querySelector('.menu');if(!old)return;old.outerHTML=`<div class="lp-title">Account</div><section class="menu"><button onclick="editProfile()"><span class="lp-label"><span class="lp-icon">👤</span>Personal Information</span></button><button onclick="lpAccount()"><span class="lp-label"><span class="lp-icon">🏦</span>Account & Virtual Account</span></button><button onclick="lpKyc()"><span class="lp-label"><span class="lp-icon">🛡️</span>KYC & Verification</span></button></section><div class="lp-title">Security & preferences</div><section class="menu"><button onclick="securitySettings()"><span class="lp-label"><span class="lp-icon">🔐</span>Security & Payment PIN</span></button><button onclick="lpBio()"><span class="lp-label"><span class="lp-icon">◉</span>Biometrics & Login</span></button><button onclick="lpRecovery()"><span class="lp-label"><span class="lp-icon">✉</span>Recovery & Access</span></button><button id="lpN" onclick="lpN()"><span class="lp-label"><span class="lp-icon">🔔</span>Notifications</span></button></section><div class="lp-title">Support & information</div><section class="menu"><button onclick="contactSupport()"><span class="lp-label"><span class="lp-icon">💬</span>Help & Support</span></button><button onclick="lpPrivacy()"><span class="lp-label"><span class="lp-icon">📄</span>Privacy & Legal</span></button><button onclick="lpAbout()"><span class="lp-label"><span class="lp-icon">ℹ</span>About LonerPay</span></button></section><div class="lp-title">Account actions</div><section class="menu lp-danger"><button onclick="lpClose()"><span class="lp-label"><span class="lp-icon">⚠</span>Close Account</span></button><button onclick="lpLogout()"><span class="lp-label"><span class="lp-icon">↪</span>Log Out</span></button></section><div class="lp-about"><strong>LonerPay by LONERHUB LIMITED</strong><br>Secure everyday payments from one account. Never share your password, OTP or payment PIN with anyone.</div>`;updateN()}

<script id="lp-profile-details-refresh">
(function(){
const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
window.editProfile=async function(){
  const token=localStorage.getItem('lonerpay_access_token');
  if(!token){location.href='index.html';return;}
  await loadProfile();
  const profile=window.lpCurrentProfile;
  if(!profile){showMessage('Unable to load your account. Please try again.');return;}
  document.querySelector('.lp-sheet')?.remove();
  const o=document.createElement('div');o.className='lp-sheet';
  o.innerHTML=`<div class="lp-card"><div class="lp-head"><div><small style="color:#0863d8;font-weight:800">YOUR ACCOUNT</small><h2>Personal information</h2></div><button type="button" class="lp-close" aria-label="Close">×</button></div><p style="color:#718096;font-size:13px;line-height:1.6">Keep your name and phone number up to date for your LonerPay account.</p><form id="lpEditForm"><label class="lp-edit-label" for="lpEditName">Full name</label><input class="lp-edit-input" id="lpEditName" autocomplete="name" maxlength="100" required value="${esc(profile.name)}"><label class="lp-edit-label" for="lpEditPhone">Phone number</label><input class="lp-edit-input" id="lpEditPhone" type="tel" autocomplete="tel" inputmode="tel" maxlength="16" required value="${esc(profile.phone)}"><label class="lp-edit-label" for="lpEditEmail">Registered email</label><input class="lp-edit-input" id="lpEditEmail" type="email" readonly value="${esc(profile.email)}"><div class="lp-note">Contact support if you need help changing your registered email. Editing profile details does not change your verified identity or bank account name.</div><div class="lp-edit-error" role="status"></div><button class="lp-primary" type="submit">Save changes</button></form></div>`;
  document.body.appendChild(o);o.querySelector('.lp-close').onclick=()=>o.remove();
  o.querySelector('form').onsubmit=async event=>{
    event.preventDefault();const name=o.querySelector('#lpEditName').value.trim(),phone=o.querySelector('#lpEditPhone').value.trim(),error=o.querySelector('.lp-edit-error'),button=o.querySelector('[type="submit"]');
    if(!name||!/^(?:0\d{10}|\+?234\d{10})$/.test(phone)){error.textContent='Enter your name and a valid Nigerian phone number.';return;}
    button.disabled=true;button.textContent='Saving…';error.textContent='';
    try{const r=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({name,phone})});const data=await r.json();if(!r.ok)throw Error(data.error||'Could not save profile');await loadProfile();o.remove();showMessage('Personal information saved.');}catch(e){error.textContent=e.message;button.disabled=false;button.textContent='Save changes';}
  };
};
async function verification(){
  const el=document.getElementById('lpProfileStatus'),token=localStorage.getItem('lonerpay_access_token');if(!el||!token)return;
  try{const r=await fetch('/api/kyc/status',{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();if(!r.ok||!d.success)throw Error();const labels={verified:'Identity verified',pending:'Verification in progress',action_required:'Verification needs attention',not_verified:'Complete your verification'};el.textContent=labels[d.status]||'Verification status unavailable';if(d.status==='verified'){el.style.background='#e9f8ef';el.style.color='#087745';}}catch{el.textContent='Verification status unavailable';}
}

})();
