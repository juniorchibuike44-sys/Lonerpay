<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LonerPay CEO Profit</title>
  <style>
    :root{--navy:#072b59;--blue:#0969da;--ink:#10213b;--muted:#718096;--bg:#f2f6fb;--green:#079455;--line:#e4ebf3}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}main{max-width:760px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900;color:var(--blue);letter-spacing:.8px}.top a{color:var(--navy);text-decoration:none;font-weight:800}.hero{background:linear-gradient(135deg,var(--navy),#0877e8);color:#fff;border-radius:25px;padding:23px;box-shadow:0 16px 35px #0b5caf26}.hero small{opacity:.78}.hero h1{font-size:32px;margin:9px 0 2px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.card span{display:block;color:var(--muted);font-size:12px}.card strong{display:block;font-size:21px;margin-top:8px}.profit strong{color:var(--green)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 10px}.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.table{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:1.2fr .7fr 1fr;gap:10px;padding:14px 15px;border-bottom:1px solid #edf1f6;align-items:center}.row:last-child{border:0}.row small{color:var(--muted)}.right{text-align:right}.positive{color:var(--green);font-weight:900}.notice{padding:14px;border-radius:14px;background:#fff8e7;color:#7a5300;font-size:13px;line-height:1.5;margin:13px 0}.error{background:#fff1f1;color:#a61b1b;padding:15px;border-radius:14px}.loading{text-align:center;padding:45px;color:var(--muted)}@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body><main>
  <div class="top"><div><div class="brand">LONERPAY</div><strong>CEO Profit Center</strong></div><a href="dashboard.html">Dashboard</a></div>
  <section id="content" class="loading">Loading secure profit report…</section>
</main>
<script>
const naira=n=>n==null?'Unavailable':'₦'+Number(n).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(days=30){const root=document.querySelector('#content'),token=localStorage.getItem('lonerpay_access_token');if(!token){location.href='index.html';return}root.className='loading';root.textContent='Loading secure profit report…';try{const r=await fetch('/api/ceo-profit?days='+days,{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load report');const t=d.totals;root.className='';root.innerHTML=`<div class="hero"><small>Estimated gross profit · last ${d.period_days} days</small><h1>${naira(t.gross_profit)}</h1><small>Calculated only from transactions with confirmed Pairgate cost</small></div><div class="grid"><div class="card"><span>Airtime sales</span><strong>${naira(t.sales)}</strong></div><div class="card"><span>Provider cost</span><strong>${naira(t.provider_cost)}</strong></div><div class="card profit"><span>Gross profit</span><strong>${naira(t.gross_profit)}</strong></div><div class="card"><span>Pairgate balance</span><strong>${naira(d.provider_balance)}</strong></div></div>${t.unpriced?`<div class="notice">${t.unpriced} older transaction${t.unpriced===1?' has':'s have'} no saved provider cost, so ${t.unpriced===1?'it is':'they are'} excluded from profit—not guessed.</div>`:''}<div class="toolbar"><strong>Daily performance</strong><select id="days"><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option></select></div><div class="table">${d.daily.length?d.daily.map(x=>`<div class="row"><div><strong>${esc(x.date)}</strong><br><small>${x.transactions} transaction${x.transactions===1?'':'s'}</small></div><div class="right"><small>Sales</small><br><strong>${naira(x.sales)}</strong></div><div class="right"><small>Profit</small><br><span class="positive">${naira(x.gross_profit)}</span></div></div>`).join(''):'<div class="loading">No Pairgate airtime transactions in this period.</div>'}</div>`;const select=document.querySelector('#days');select.value=String(days);select.onchange=()=>load(select.value)}catch(e){root.className='error';root.textContent=e.message}}
load();
</script></body></html>
