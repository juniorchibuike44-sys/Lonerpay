<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LonerPay CEO Operations Center</title>
  <style>
    :root{--navy:#072b59;--blue:#0969da;--ink:#10213b;--muted:#718096;--bg:#f2f6fb;--green:#079455;--red:#b42318;--amber:#a15c00;--line:#e4ebf3}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}main{max-width:820px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:900;color:var(--blue);letter-spacing:.8px}.top a{color:var(--navy);text-decoration:none;font-weight:800}.hero{background:linear-gradient(135deg,var(--navy),#0877e8);color:#fff;border-radius:25px;padding:23px;box-shadow:0 16px 35px #0b5caf26}.hero small{opacity:.82}.hero h1{font-size:34px;margin:9px 0 4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}.card span{display:block;color:var(--muted);font-size:12px}.card strong{display:block;font-size:20px;margin-top:8px;overflow-wrap:anywhere}.profit strong,.positive{color:var(--green)}.pending strong{color:var(--amber)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 10px;gap:12px}.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.table{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:1.25fr .8fr .9fr;gap:8px;padding:14px 15px;border-bottom:1px solid #edf1f6;align-items:center}.row:last-child{border:0}.row small{color:var(--muted)}.right{text-align:right}.status{font-size:11px;font-weight:800;text-transform:capitalize}.successful{color:var(--green)}.failed{color:var(--red)}.notice{padding:14px;border-radius:14px;background:#fff8e7;color:#7a5300;font-size:13px;line-height:1.5;margin:13px 0}.scope{background:#edf7ff;color:#145a91}.error{background:#fff1f1;color:#a61b1b;padding:15px;border-radius:14px}.loading{text-align:center;padding:45px;color:var(--muted)}h2{font-size:19px;margin:0}@media(min-width:680px){.grid{grid-template-columns:repeat(3,1fr)}}
  </style>

<style id="lonerpay-ceo-video-style">
:root{--navy:#142443;--blue:#365987;--ink:#f0f5ff;--muted:#a5b9d7;--bg:#182b4d;--line:#355078;--green:#a4efd1;--red:#ffa7b0;--amber:#ffe2a0}
html{scroll-behavior:smooth}body{background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}main{max-width:1320px;margin:0 auto;padding:30px 34px 65px 220px}
.ceo-side{position:fixed;inset:0 auto 0 0;width:180px;background:#10203b;border-right:1px solid #2b4265;padding:28px 18px;display:flex;flex-direction:column;z-index:10}.ceo-side .logo{font-size:20px;font-weight:900;color:white;letter-spacing:.5px;margin-bottom:8px}.ceo-side small{color:#849bbb;font-size:10px;letter-spacing:1.5px}.ceo-side nav{display:grid;gap:8px;margin-top:40px}.ceo-side a{padding:12px 10px;border-radius:6px;color:#9cb0d0;text-decoration:none;font-size:12px;font-weight:700}.ceo-side a:first-child{background:#2b4872;color:white}.ceo-side a:hover{background:#29446a;color:white}.ceo-side footer{margin-top:auto;color:#7890b2;font-size:11px;line-height:1.7}
.top{border-bottom:1px solid #304968;padding-bottom:20px;margin-bottom:24px;gap:15px}.brand{color:#a8c9ff;font-size:11px;letter-spacing:2px;margin-bottom:7px}.top strong{font-size:22px;font-weight:600}.top a{padding:10px 15px;border:1px solid #416089;border-radius:6px;color:#c6d8f4;font-size:12px}
.hero{padding:27px 25px;border-radius:7px;background:#28466f;box-shadow:none;border:1px solid #3a5984;text-align:center}.hero h1{font-size:36px;margin:14px 0 10px;letter-spacing:.3px}.hero small{font-size:11px;color:#b9cceb}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:16px 0 24px}.card{display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:115px;border:1px solid #3a5882;border-radius:6px;background:#2b4a77;padding:20px 12px}.card span{order:2;margin-top:11px;color:#bbcee9;font-size:11px}.card strong{order:1;margin:0;font-size:22px;color:#fff;letter-spacing:.2px}.pending strong{color:#ffe2a0}.toolbar{margin:32px 1px 12px}.toolbar h2{font-size:14px;color:#dbe8ff;font-weight:700}.toolbar select{background:#223c62;color:#dceaff;border-color:#405c82;border-radius:6px}.table{background:#233c62;border:1px solid #36527b;border-radius:6px}.row{border-color:#344e72;padding:17px 20px}.row strong{font-size:13px}.row small{color:#9db3d2;font-size:11px}.notice{border:1px solid #63583f;background:#3b3d40;color:#ffe0a9;border-radius:6px;font-size:11px}.notice.scope{background:#213e64;color:#c0d8ff;border-color:#3b5b89}.loading{color:#a5b9d7}.error{background:#482d3b;color:#ffc0c7;border:1px solid #754151;border-radius:6px}
@media(max-width:850px){main{padding-left:160px;padding-right:22px}.ceo-side{width:138px;padding:25px 12px}.ceo-side .logo{font-size:17px}.card strong{font-size:17px}.grid{gap:10px}}
@media(max-width:600px){.ceo-side{position:static;width:100%;padding:17px 18px;display:block;border-right:0;border-bottom:1px solid #304969}.ceo-side small,.ceo-side footer{display:none}.ceo-side .logo{margin:0}.ceo-side nav{display:flex;overflow:auto;gap:6px;margin:14px 0 0}.ceo-side a{white-space:nowrap;padding:9px 10px;font-size:11px}main{padding:22px 15px 45px}.top strong{font-size:18px}.top a{font-size:11px;padding:9px}.hero h1{font-size:29px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-height:100px}.card strong{font-size:18px}.row{padding:14px 12px;gap:7px}.row strong{font-size:12px}.row small{font-size:10px}}
</style>

<style id="ceo-navy-gold">
:root{--bg:#061426;--ink:#f4f6fb;--muted:#8999b1;--line:#21334e;--green:#a0dcaa;--blue:#e5c57f}
body{background:#061426}.ceo-side{background:linear-gradient(#092540,#09213b);border-color:#233c56}.ceo-side .logo{color:#e5c57f;letter-spacing:1px}.ceo-side small{color:#a2afc3}.ceo-side a:first-child,.ceo-side a:hover{background:#9b8350;color:white}.top{border-color:#21334e}.brand{color:#e5c57f}.top a{border-color:#826e45;color:#f2d38b;background:#19283b}.hero{background:linear-gradient(130deg,#10243e,#0d1c32);border-color:#263952;border-radius:10px}.hero h1{color:#f1d18b}.hero small{color:#a8b6cb}.card{background:linear-gradient(140deg,#11223a,#0d1b2f);border-color:#24364e;border-radius:9px}.card span{color:#9aaac0}.card strong{color:#f8fafc}.card:before{content:"◇";color:#e5c57f;font-size:23px;margin-bottom:13px}.toolbar h2{color:white}.toolbar select{background:#112138;border-color:#736341;color:#efcf87}.table{background:#0d1d33;border-color:#23354f;border-radius:9px}.row{border-color:#23334b}.notice.scope{background:#10243e;color:#b5c7e0;border-color:#2b4260}.ceo-chart{background:#0d1d33;border:1px solid #23354f;border-radius:10px;padding:22px;margin-top:25px}.ceo-chart h2{font-size:18px;color:#fff}.ceo-chart p{font-size:12px;color:#9daec6;margin:8px 0 20px}.ceo-chart svg{width:100%;height:auto;display:block}.ceo-chart figcaption{display:flex;justify-content:space-between;color:#9daec6;font-size:11px;padding-top:12px}.ceo-chart .chart-empty{padding:35px 0;color:#91a4be;text-align:center}.ceo-chart-note{font-size:11px;color:#c4b083;margin-top:15px}
</style>
</head>
<body><aside class="ceo-side"><div class="logo">LonerPay</div><small>OPERATIONS CENTER</small><nav aria-label="Operations navigation"><a href="#content">Overview</a><a href="#ceoProviders">Providers</a><a href="#ceoDaily">Daily performance</a><a href="#ceoRecent">Transactions</a><a href="profile.html">My profile</a></nav><footer>One app.<br>Everyday payments.</footer></aside><main>
  <div class="top"><div><div class="brand">LONERPAY</div><strong>CEO Operations Center</strong></div><a href="dashboard.html">Dashboard</a></div>
  <section id="content" class="loading">Loading company activity…</section>
</main>
<script>
const naira=n=>n==null?'Unavailable':'₦'+Number(n).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(rows,empty)=>`<div class="table">${rows||`<div class="loading">${empty}</div>`}</div>`;

function salesChart(rows){
 const points=(rows||[]).filter(x=>Number.isFinite(Number(x.sales))).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 if(!points.length)return '<div class="ceo-chart"><h2>Sales chart</h2><div class="chart-empty">No recorded sales for this period.</div></div>';
 const max=Math.max(1,...points.map(x=>Number(x.sales))),w=800,h=220;
 const coords=points.map((x,i)=>[40+(points.length===1?360:i/(points.length-1)*720),200-Number(x.sales)/max*170]);
 const line=coords.map(x=>x.join(',')).join(' ');
 const grids=[0,.25,.5,.75,1].map(v=>'<line x1="40" y1="'+(200-v*170)+'" x2="760" y2="'+(200-v*170)+'" stroke="#23364f"/>').join('');
 return '<figure class="ceo-chart"><h2>Sales chart</h2><p>Recorded service sales by day · amounts in naira</p><svg role="img" aria-label="Daily service sales" viewBox="0 0 '+w+' '+h+'">'+grids+'<polyline points="'+line+'" fill="none" stroke="#e5c57f" stroke-width="3" stroke-linejoin="round"/>'+coords.map((pt,i)=>'<circle cx="'+pt[0]+'" cy="'+pt[1]+'" r="4" fill="#e5c57f"><title>'+esc(points[i].date)+' · '+naira(points[i].sales)+'</title></circle>').join('')+'</svg><figcaption><span>'+esc(points[0].date)+'</span><span>'+esc(points[points.length-1].date)+'</span></figcaption><div class="ceo-chart-note">Highest daily sales: '+naira(max===1&&points.every(x=>Number(x.sales)===0)?0:max)+'</div></figure>';
}

async function refreshLogin(){
 const refreshToken=localStorage.getItem('lonerpay_refresh_token');if(!refreshToken)return null;
 try{const c=await fetch('/api/config',{cache:'no-store'}),cfg=await c.json();const r=await fetch(`${cfg.supabaseUrl}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.supabasePublishableKey},body:JSON.stringify({refresh_token:refreshToken})});const s=await r.json();if(!r.ok||!s.access_token)return null;localStorage.setItem('lonerpay_access_token',s.access_token);if(s.refresh_token)localStorage.setItem('lonerpay_refresh_token',s.refresh_token);return s.access_token}catch{return null}
}
async function load(days=30,retried=false){
 const root=document.querySelector('#content');let token=localStorage.getItem('lonerpay_access_token');if(!token)token=await refreshLogin();if(!token){location.href='index.html';return}
 root.className='loading';root.textContent='Loading company activity…';
 try{
  const r=await fetch('/api/ceo-profit?days='+days,{headers:{Authorization:'Bearer '+token},cache:'no-store'}),d=await r.json();if(r.status===401&&!retried){const renewed=await refreshLogin();if(renewed)return load(days,true);localStorage.removeItem('lonerpay_access_token');localStorage.removeItem('lonerpay_refresh_token');location.href='index.html';return}if(!r.ok)throw new Error(d.message||d.error||'Could not load report');const t=d.totals;
  const balances=d.provider_balances||{};
  const providers=(d.providers||[]).map(x=>`<div class="row"><div><strong>${esc(x.provider)}</strong><br><small>${x.transactions} transactions · ${x.pending} pending</small></div><div class="right"><small>Volume</small><br><strong>${naira(x.volume)}</strong></div><div class="right"><small>Profit</small><br><strong class="positive">${naira(x.profit)}</strong></div></div>`).join('');
  const daily=(d.daily||[]).map(x=>`<div class="row"><div><strong>${esc(x.date)}</strong><br><small>${x.transactions} transactions</small></div><div class="right"><small>Sales</small><br><strong>${naira(x.sales)}</strong></div><div class="right"><small>Profit</small><br><strong class="positive">${naira(x.profit)}</strong></div></div>`).join('');
  const recent=(d.recent||[]).map(x=>`<div class="row"><div><strong>${esc(x.service)}</strong><br><small>${esc(x.provider)} · ${esc(x.date)}</small></div><div class="right"><small class="status ${esc(x.status)}">${esc(x.status)}</small><br><strong>${naira(x.amount)}</strong></div><div class="right"><small>Profit</small><br><strong class="positive">${x.profit==null?'—':naira(x.profit)}</strong></div></div>`).join('');
  root.className='';root.innerHTML=`
   <div class="hero"><small>Confirmed gross profit · last ${d.period_days} days</small><h1>${naira(t.gross_profit)}</h1><small>Across services with a recorded provider cost</small></div>
   <div class="grid">
    <div class="card"><span>Wallet inflows</span><strong>${naira(t.wallet_inflows)}</strong></div><div class="card"><span>Service sales</span><strong>${naira(t.service_sales)}</strong></div><div class="card"><span>Refunds</span><strong>${naira(t.refunds)}</strong></div><div class="card pending"><span>Pending</span><strong>${t.pending}</strong></div><div class="card"><span>Paystack balance</span><strong>${naira(balances.paystack)}</strong></div><div class="card"><span>Pairgate balance</span><strong>${naira(balances.pairgate)}</strong></div>
   </div>
   ${d.report_scope==='founder_account'?'<div class="notice scope">This view currently shows the CEO account activity permitted by the database. Company-wide reporting will appear automatically when the server reporting credential has administrative read access.</div>':''}
   ${t.unpriced_sales?`<div class="notice">${t.unpriced_sales} successful service transaction${t.unpriced_sales===1?' has':'s have'} no recorded provider cost. ${t.unpriced_sales===1?'It is':'They are'} included in sales but excluded from profit rather than guessed.</div>`:''}
   <div class="toolbar"><h2 id="ceoProviders">Provider overview</h2><select id="days"><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option></select></div>${table(providers,'No provider activity in this period.')}
   ${salesChart(d.daily)}
   <div class="toolbar"><h2 id="ceoDaily">Daily performance</h2></div>${table(daily,'No transactions in this period.')}
   <div class="toolbar"><h2 id="ceoRecent">Recent activity</h2></div>${table(recent,'No recent activity.')}`;
  const select=document.querySelector('#days');select.value=String(days);select.onchange=()=>load(select.value);
 }catch(e){root.className='error';root.textContent=e.message}
}
load();
</script></body></html>
