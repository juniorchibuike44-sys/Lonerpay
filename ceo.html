<!doctype html><html lang="en"><head><script src="session-guard.js?v=20261017-logout"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LonerPay Admin Dashboard</title><style>
:root{--bg:#051325;--panel:#0e1d32;--border:#23334b;--muted:#95a5bc;--gold:#e8ca85}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fc;font:14px Arial,sans-serif}button,select{font:inherit}button,a,select{touch-action:manipulation}aside{width:220px;position:fixed;inset:0 auto 0 0;background:linear-gradient(#092740,#082039);padding:26px 20px;border-right:1px solid var(--border);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:22px;font-weight:900;line-height:1}.brand span{border:2px solid var(--gold);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:20px}.tag{color:#d3dcec;font-size:11px;margin-top:12px}nav{display:grid;gap:7px;margin-top:28px}nav button{border:0;text-align:left;padding:12px 13px;background:none;color:#c3cfe1;border-radius:6px;cursor:pointer;font-size:13px}nav button.on{background:#9b8450;color:#fff}nav button i{font-style:normal;display:inline-block;width:24px;color:#b7c9e5}aside footer{margin-top:auto;border:1px solid #31445f;border-radius:8px;padding:13px;font-size:12px}aside footer small{display:block;color:var(--muted);margin-top:6px}main{margin-left:220px;padding:25px 28px 40px;max-width:1600px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}h1{font-size:25px;margin:0 0 6px}header p{font-size:11px;color:#c3cde0;margin:0}.tools{display:flex;gap:8px;align-items:center}select,.outline{background:#102035;border:1px solid #7b6944;color:var(--gold);padding:9px 11px;border-radius:5px}.gold{background:var(--gold);color:#14213a;border:0;padding:10px 16px;border-radius:5px;font-weight:800;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.metric,.panel{background:linear-gradient(140deg,#102039,#0c1b2e);border:1px solid var(--border);border-radius:8px}.metric{text-align:center;padding:20px 9px}.metric .icon{color:var(--gold);font-size:30px;margin-bottom:14px}.metric h3{font-size:12px;margin:0 0 9px}.metric strong{font-size:25px;overflow-wrap:anywhere;display:block}.metric small{display:block;color:var(--muted);font-size:10px;margin-top:9px}.layout{display:grid;grid-template-columns:1.05fr 1.1fr;gap:15px;margin-top:18px}.panel{padding:18px;min-width:0}.panel h2{font-size:17px;margin:0 0 7px}.sub{font-size:11px;color:var(--muted);margin:0 0 18px}.chart{width:100%;height:260px;display:block}.axis{display:flex;justify-content:space-between;color:#b9ab88;font-size:10px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.split .panel strong{font-size:22px;display:block;margin:12px 0 6px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th{color:var(--gold);font-size:10px;text-align:left;font-weight:500;padding:11px 6px}td{padding:12px 6px;border-top:1px solid #26354c;white-space:nowrap}.badge{padding:4px 6px;border-radius:4px;font-size:9px;background:#ecd68d;color:#392c0f}.badge.successful{background:#b1dca2;color:#244c1d}.badge.failed{background:#dd7779;color:#fff}.notice{padding:12px 15px;background:#192941;border:1px solid #384964;border-radius:7px;font-size:11px;color:#bed0e7;margin:16px 0;line-height:1.5}.link{border:0;color:var(--gold);background:none;cursor:pointer;padding:0;font-size:11px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.empty{padding:35px 10px;text-align:center;color:var(--muted);font-size:13px}.section{margin-top:20px}.loading{padding:80px 20px;text-align:center;color:var(--muted)}a{color:var(--gold)}button:disabled{opacity:.5;cursor:default}
@media(max-width:1000px){aside{width:185px;padding:25px 14px}main{margin-left:185px;padding:23px 18px}.metric strong{font-size:20px}.layout{grid-template-columns:1fr}}
@media(max-width:650px){aside{position:static;width:100%;padding:17px}aside .brand{font-size:18px}.tag,aside footer{display:none}nav{display:flex;overflow:auto;gap:6px;margin:15px 0 0}nav button{white-space:nowrap;padding:9px}main{margin-left:0;padding:20px 14px}header{align-items:flex-start;flex-direction:column}.tools{width:100%}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:17px 8px}.metric strong{font-size:22px}.split{grid-template-columns:1fr 1fr}.panel{padding:15px}.chart{height:220px}}
</style><script src="business-session.js?v=20261017-session" defer></script><script src="business-subscription-admin.js?v=20261018-fees" defer></script><script src="notifications-admin.js?v=20261017-inbox" defer></script></head><body><aside><div class="brand"><span>▱</span>LONER<br>PAY</div><div class="tag">Payments for Everyone</div><nav id="nav"><button class="on" data-view="overview"><i>▣</i>Dashboard</button><button data-view="transactions"><i>▤</i>Transactions</button><button data-view="users"><i>♙</i>Users</button><button data-view="merchants"><i>▦</i>Merchants</button><button data-view="kyc"><i>◇</i>KYC</button><button data-view="settlements"><i>▥</i>Settlements</button><button data-view="payouts"><i>↗</i>Payouts</button><button data-view="notifications"><i>♧</i>Notifications</button><button data-view="settings"><i>⚙</i>Settings</button></nav><footer>Owner account<small id="owner">Authenticated access required</small></footer></aside><main><header><div><h1 id="title">Dashboard</h1><p id="subtitle">Your LonerPay business overview</p></div><div class="tools"><select id="days" aria-label="Report period"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select><button class="outline" id="refresh">↻ Refresh</button><button class="gold" id="export" disabled>↓ Export</button></div></header><div id="content" class="loading">Loading company activity…</div></main><script>

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v==null?'Unavailable':'₦'+Number(v).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
let report=null,view='overview',busy=false;
function rows(items){return '<div class="tablewrap"><table><thead><tr><th>Reference</th><th>Service</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>'+items.map(t=>'<tr><td>'+esc(t.reference)+'</td><td>'+esc(t.service)+'</td><td>'+money(t.amount)+'</td><td><span class="badge '+esc(t.status)+'">'+esc(t.status)+'</span></td><td>'+esc(new Date(t.date).toLocaleString('en-NG',{timeZone:'Africa/Lagos',dateStyle:'short',timeStyle:'short'}))+'</td></tr>').join('')+'</tbody></table></div>';}
function chart(){const points=(report.daily||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));if(!points.length)return '<div class="empty">No service sales recorded for this period.</div>';const max=Math.max(1,...points.map(x=>Number(x.sales)||0));const coords=points.map((x,i)=>[50+(points.length===1?235:i/(points.length-1)*470),230-Number(x.sales)/max*195]);const grid=[0,.25,.5,.75,1].map(v=>'<line x1="50" x2="520" y1="'+(230-v*195)+'" y2="'+(230-v*195)+'" stroke="#23354c"/><text x="45" y="'+(234-v*195)+'" text-anchor="end" fill="#a99c7b" font-size="9">'+esc(Number(max*v).toLocaleString('en-NG',{maximumFractionDigits:0}))+'</text>').join('');return '<svg class="chart" viewBox="0 0 540 250" role="img" aria-label="Daily service sales in naira">'+grid+'<polyline fill="none" stroke="#e8ca85" stroke-width="2.5" points="'+coords.map(x=>x.join(',')).join(' ')+'"/>'+coords.map((pt,i)=>'<circle cx="'+pt[0]+'" cy="'+pt[1]+'" r="3" fill="#e8ca85"><title>'+esc(points[i].date)+' '+money(points[i].sales)+'</title></circle>').join('')+'</svg><div class="axis"><span>'+esc(points[0].date)+'</span><span>'+esc(points[points.length-1].date)+'</span></div>';}
function render(){if(document.getElementById('content').dataset.businessSales==='1')return;const nr=document.getElementById('content');if(view==='notifications'){if(nr.dataset.notificationsView!=='1')window.loadAdminNotifications?.();return;}delete nr.dataset.notificationsView;if(!report)return;if(['users','kyc','merchants','settlements','payouts'].includes(view)){loadAdminSection(view,sectionPage);return;}const t=report.totals,b=report.provider_balances||{},items=report.transactions||[];const root=document.getElementById('content');root.className='';document.getElementById('title').textContent=view==='overview'?'Dashboard':view[0].toUpperCase()+view.slice(1);const scope=report.report_scope==='founder_account'?'<div class="notice">This report covers your owner account only. Company-wide reporting requires the configured server credential to have company read access.</div>':'';const limits='<div class="notice">Report covers the latest 2,000 wallet records; transaction export contains the latest 100 records in the selected period. Service sales are payment volume. Gross profit excludes '+Number(t.unpriced_sales||0)+' sales without recorded provider costs.</div>';
if(view==='overview'){root.innerHTML='<div class="metrics">'+[['▱','Total Transactions',t.activity,'Wallet activity in selected period'],['↗','Service Sales',money(t.service_sales),'Successful service payment volume'],['♙','Active Users',t.active_users??'Unavailable','Users with wallet activity in this report'],['◇','Pending Transactions',t.pending,'Awaiting confirmation']].map(x=>'<article class="metric"><div class="icon">'+x[0]+'</div><h3>'+x[1]+'</h3><strong>'+x[2]+'</strong><small>'+x[3]+'</small></article>').join('')+'</div>'+scope+'<div class="layout"><section class="panel"><div class="panelhead"><h2>Sales Chart</h2><span style="color:#e8ca85;font-size:11px">● Service sales</span></div><p class="sub">Daily sales · last '+report.period_days+' days · NGN</p>'+chart()+'<p class="sub" style="margin-top:20px">Total this period: <strong style="color:#e8ca85">'+money(t.service_sales)+'</strong></p></section><div><section class="panel"><div class="panelhead"><h2>Recent Transactions</h2><button class="link" data-go="transactions">View all</button></div>'+(items.length?rows(items.slice(0,5)):'<div class="empty">No transactions yet.</div>')+'</section><div class="split"><section class="panel"><h2>Gross Profit</h2><strong>'+money(t.gross_profit)+'</strong><p class="sub">With recorded provider costs</p></section><section class="panel"><h2>Refunds</h2><strong>'+money(t.refunds)+'</strong><p class="sub">Recorded refunded activity</p></section></div></div></div><section class="panel section"><h2>Provider balances</h2><div class="split"><div>Paystack<strong style="display:block;margin-top:10px;color:#e8ca85">'+money(b.paystack)+'</strong></div><div>Pairgate<strong style="display:block;margin-top:10px;color:#e8ca85">'+money(b.pairgate)+'</strong></div></div></section>'+limits;}
else if(view==='transactions')root.innerHTML=scope+'<section class="panel"><h2>Transactions</h2><p class="sub">Latest '+items.length+' wallet records in the selected period</p>'+rows(items)+'</section>'+limits;
else if(view==='users')root.innerHTML=scope+'<section class="panel"><h2>Active users</h2><p class="sub">Distinct accounts with wallet activity in the selected report</p><strong style="font-size:36px;color:#e8ca85">'+(t.active_users??'Unavailable')+'</strong><div class="notice">This count is activity-based. A customer directory is not connected to this reporting endpoint.</div></section>';
else if(view==='settings')root.innerHTML='<section class="panel"><h2>Account settings</h2><p class="sub">Manage your account, verification and security.</p><a href="profile.html">Open Profile & Settings →</a></section>';
else if(view==='settlements'||view==='payouts')root.innerHTML='<section class="panel"><h2>'+esc(view==='payouts'?'Payouts':'Settlements')+'</h2><div class="notice">A '+esc(view)+' ledger is not connected. Provider balances below are available funds, not a '+esc(view)+' total.</div><div class="split"><div>Paystack: '+money(b.paystack)+'</div><div>Pairgate: '+money(b.pairgate)+'</div></div></section>';
else root.innerHTML='<section class="panel"><h2>'+esc(view==='kyc'?'KYC management':'Merchants')+'</h2><div class="notice">'+(view==='kyc'?'Company-wide KYC records are not connected to this report. Your own verification is available in Profile.':'Merchant records are not configured. No merchant count is available.')+'</div>'+(view==='kyc'?'<a href="profile.html">Open Profile →</a>':'')+'</section>';
root.querySelectorAll('[data-go]').forEach(btn=>btn.onclick=()=>setView(btn.dataset.go));}
function setView(next){sectionPage=1;view=next;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===next));render();}
async function renew(){const refresh_token=localStorage.getItem('lonerpay_refresh_token');if(!refresh_token)return null;const c=await fetch('/api/config'),cfg=await c.json();const r=await fetch(cfg.supabaseUrl+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.supabasePublishableKey},body:JSON.stringify({refresh_token})});const s=await r.json();if(!r.ok||!s.access_token)return null;localStorage.setItem('lonerpay_access_token',s.access_token);if(s.refresh_token)localStorage.setItem('lonerpay_refresh_token',s.refresh_token);return s.access_token;}
async function load(){if(busy)return;busy=true;document.getElementById('refresh').disabled=true;try{let token=localStorage.getItem('lonerpay_access_token');if(!token)token=await renew();if(!token){location.href='index.html';return;}let r=await fetch('/api/ceo-profit?days='+document.getElementById('days').value,{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(r.status===401){token=await renew();if(!token){location.href='index.html';return;}r=await fetch('/api/ceo-profit?days='+document.getElementById('days').value,{headers:{Authorization:'Bearer '+token},cache:'no-store'});}const data=await r.json();if(!r.ok)throw Error(data.message||data.error||'Could not load dashboard');report=data;document.getElementById('export').disabled=false;document.getElementById('owner').textContent='Owner access verified';document.getElementById('subtitle').textContent='Updated '+new Date(data.generated_at).toLocaleString('en-NG',{timeZone:'Africa/Lagos'})+' · last '+data.period_days+' days';render();}catch(e){document.getElementById('content').className='notice';document.getElementById('content').textContent=e.message;}finally{busy=false;document.getElementById('refresh').disabled=false;}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.getElementById('days').onchange=load;document.getElementById('refresh').onclick=load;
document.getElementById('export').onclick=()=>{if(!report)return;const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';const lines=[['Reference','Service','Amount NGN','Status','Date','Gross profit NGN'],...(report.transactions||[]).map(t=>[t.reference,t.service,t.amount,t.status,t.date,t.gross_profit])];const blob=new Blob([lines.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='LonerPay-admin-transactions.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};

let sectionPage=1,sectionRequest=0;
async function loadAdminSection(section,page){
 const request=++sectionRequest,root=document.getElementById('content');root.className='loading';root.textContent='Loading '+section+'…';document.getElementById('title').textContent=section[0].toUpperCase()+section.slice(1);
 try{const r=await fetch('/api/admin-records?section='+section+'&page='+page+'&days='+document.getElementById('days').value,{headers:{Authorization:'Bearer '+localStorage.getItem('lonerpay_access_token')},cache:'no-store'});const d=await r.json();if(request!==sectionRequest||view!==section)return;if(!r.ok)throw Error(d.error||'Could not load records');
 const fields=section==='users'?['name','email','phone','email_verified','created_at','last_sign_in_at']:section==='kyc'?['customer_email','account_name','assignment_status','bank_name']:section==='merchants'?['reference','name','bank','status','currency']:section==='payouts'?['reference','recipient','amount','currency','status','date']:['reference','amount','effective_amount','currency','status','date'];
 function value(row,key){if(key==='amount'||key==='effective_amount')return row.currency==='NGN'?money(row[key]):row[key]==null?'Unavailable':String(row[key])+' '+(row.currency||'');if(key==='email_verified')return row[key]?'Verified':'Unverified';return row[key]??'—';}
 root.className='';root.innerHTML='<section class="panel"><h2>'+esc(section==='kyc'?'KYC & verification':section==='merchants'?'Merchant settlement subaccounts':section==='payouts'?'Paystack outbound transfers':section==='settlements'?'Paystack settlements':'Customer directory')+'</h2><p class="sub">'+esc(d.source)+' · '+esc(d.mode)+' mode · page '+d.page+(d.total==null?'':' · '+d.total+' records')+'</p><div class="tablewrap"><table><thead><tr>'+fields.map(f=>'<th>'+esc(f.replaceAll('_',' '))+'</th>').join('')+'</tr></thead><tbody>'+(d.records||[]).map(row=>'<tr>'+fields.map(f=>'<td>'+esc(value(row,f))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(!d.records.length?'<div class="empty">No records returned by this source.</div>':'')+'<div style="display:flex;gap:10px;margin-top:20px"><button class="outline" id="previous" '+(page<=1?'disabled':'')+'>Previous</button><button class="outline" id="next" '+(!d.has_more?'disabled':'')+'>Next</button></div></section>';
 root.querySelector('#previous').onclick=()=>{sectionPage--;loadAdminSection(section,sectionPage);};root.querySelector('#next').onclick=()=>{sectionPage++;loadAdminSection(section,sectionPage);};
 if(section==='users'){const requests=d.records.filter(x=>x.support||x.closure);if(requests.length){const panel=document.createElement('section');panel.className='panel section';panel.innerHTML='<h2>Customer requests on this page</h2>'+requests.map(x=>'<div class="notice"><strong>'+esc(x.email)+'</strong>'+(x.support?'<p>Support: '+esc(x.support.reference)+' · '+esc(x.support.status)+'</p><p>'+esc(x.support.message)+'</p>':'')+(x.closure?'<p>Account closure: '+esc(x.closure.reference)+' · '+esc(x.closure.status)+'</p>':'')+'</div>').join('');root.append(panel);}}
 }catch(e){if(request===sectionRequest&&view===section){root.className='notice';root.textContent=e.message;}}
}

load();setInterval(()=>{if(!document.hidden)load();},60000);


</script></body></html>
