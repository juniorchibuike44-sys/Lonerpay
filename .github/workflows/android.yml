name: Android test package
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/android-assetlinks.mjs']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      sign_release:
        description: 'Sign with the upload key stored in repository secrets'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and lint
        run: gradle -p android :app:assembleDebug :app:bundleRelease :app:lintDebug --no-daemon
      - name: Prepare labelled test artifacts
        run: |
          mkdir -p android-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk android-artifacts/LonerPay-Test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab android-artifacts/LonerPay-UNSIGNED.aab
          printf '%s\n' 'Test APK: com.lonerpay.app.debug. Not a production release.' 'Unsigned AAB: cannot be submitted until signed.' 'Browser toolbar remains until website/certificate association is verified.' 'Do not submit debug signing keys to Play Console.' > android-artifacts/READ-ME.txt
          gradle -p android :app:signingReport --no-daemon > android-artifacts/signing-report.txt
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: LonerPay-Android-Test
          path: android-artifacts/
          retention-days: 14
      - name: Sign approved release on manual request
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/lonerpay-upload.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          gradle -p android :app:bundleRelease --no-daemon --rerun-tasks
          mkdir -p signed-release
          cp android/app/build/outputs/bundle/release/app-release.aab signed-release/LonerPay-Upload.aab
          jarsigner -verify signed-release/LonerPay-Upload.aab
      - name: Upload signed bundle
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release
        uses: actions/upload-artifact@v4
        with:
          name: LonerPay-Signed-Upload
          path: signed-release/LonerPay-Upload.aab
          retention-days: 7
