<script>function processPayment(type, amount, details) {
  const value = Number(amount);

  if (!value || value <= 0) {
    alert("Enter a valid amount.");
    return false;
  }

  const balanceElement = document.querySelector(".balance h2");

  if (!balanceElement) {
    alert("Wallet balance not found.");
    return false;
  }

  const currentBalance = Number(
    balanceElement.textContent.replace(/[₦,]/g, "")
  );

  if (value > currentBalance) {
    alert("Insufficient wallet balance.");
    return false;
  }
if (value === 99) {
    alert("Payment failed. Please try again.");
    return false;
} 
  const newBalance = currentBalance - value;
walletBalance = newBalance;
localStorage.setItem("lonerpay_balance", String(newBalance)); 
  balanceElement.textContent =
    "₦" + newBalance.toFixed(2);

  

  return true;
} 
function recordTransaction(type, amount, details, save = true, status = "Successful") { 
  const transactionsBox = document.querySelector(".transactions");
  if (!transactionsBox) return;

  const empty = transactionsBox.querySelector(".transaction");

  if (empty && empty.textContent.includes("No transactions yet")) {
    empty.remove();
  }
if (save) {
    const transactions = JSON.parse(
        localStorage.getItem("lonerPayTransactions") || "[]"
    );

    transactions.unshift({
        type: type,
        amount: Number(amount),
        details: details,
status: status, 
date: new Date().toISOString() 
    });

    localStorage.setItem(
        "lonerPayTransactions",
        JSON.stringify(transactions.slice(0, 50))
    );
} 
  const transaction = document.createElement("div");
  transaction.className = "transaction";

  transaction.innerHTML =
    "<strong>" + type + "</strong><br>" +
    "₦" + Number(amount).toFixed(2) + "<br>" +
    "<small>" + details + "</small><br>" +
"<small><strong>Status: " + status + "</strong></small>";  

  transactionsBox.appendChild(transaction);
} 
function loadSavedTransactions() 
{
  const saved = JSON.parse(
    localStorage.getItem("lonerPayTransactions")
) || []; 

    saved.forEach(transaction => {
        recordTransaction(
            transaction.type,
            transaction.amount,
            transaction.details,
false,
transaction.status || "Successful" 
            
        );
    });
}

loadSavedTransactions();

   alert("Payment failed");

);
