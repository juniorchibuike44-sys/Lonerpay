<script>function processPayment(type, amount, details) {

  if (!balanceElement) {
    alert("Wallet balance not found.");
    return false;
  }

  const currentBalance = Number(
    balanceElement.textContent.replace(/[₦,]/g, "")
  );

  if (value > currentBalance) {
    alert("Insufficient wallet balance.");
    return false;
  }
if (value === 99) {
    alert("Payment failed. Please try again.");
    return false;
} 
  const newBalance = currentBalance - value;
walletBalance = newBalance;
localStorage.setItem("lonerpay_balance", String(newBalance));

    "₦" + newBalance.toFixed(2);

  

  return true;
} 
function makeReceiptId() {
  return "LP-" + Date.now().toString(36).toUpperCase() +
    "-" + Math.random().toString(36).slice(2, 7).toUpperCase();
}

function escapeReceiptText(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  })[character]);
}

function recordTransaction(type, amount, details, save = true, status = "Successful", date, receiptId) { 
  const transactionsBox = document.querySelector(".transactions");
  if (!transactionsBox) return;

  const transactionData = {
    type: type,
    amount: Number(amount),
    details: details,
    status: status,
    date: date || new Date().toISOString(),
    receiptId: receiptId || makeReceiptId()
  };

  const empty = transactionsBox.querySelector(".transaction");

  if (empty && empty.textContent.includes("No transactions yet")) {
    empty.remove();
  }
if (save) {
    const transactions = JSON.parse(
        localStorage.getItem("lonerPayTransactions") || "[]"
    );

    transactions.unshift(transactionData);

    localStorage.setItem(
        "lonerPayTransactions",
        JSON.stringify(transactions.slice(0, 50))
    );
} 
  const transaction = document.createElement("div");
  transaction.className = "transaction";

  transaction.innerHTML =
    "<strong>" + escapeReceiptText(type) + "</strong><br>" +
    "₦" + Number(amount).toFixed(2) + "<br>" +
    "<small>" + escapeReceiptText(details) + "</small><br>" +
    "<small><strong>Status: " + escapeReceiptText(status) + "</strong></small><br>" +
    "<button type=\"button\" class=\"receipt-button\">View Receipt</button>";

  transaction.querySelector(".receipt-button").onclick = () => {
    showDigitalReceipt(transactionData);
  };

  transactionsBox.appendChild(transaction);
  return transactionData;
} 
function loadSavedTransactions() 
{
  const saved = JSON.parse(
    localStorage.getItem("lonerPayTransactions")
) || []; 

    saved.forEach(transaction => {
        recordTransaction(
            transaction.type,
            transaction.amount,
            transaction.details,
false,
transaction.status || "Successful",
transaction.date,
transaction.receiptId
            
        );
    });
}

function showDigitalReceipt(transaction) {
  const overlay = document.createElement("div");
  const receiptDate = new Date(transaction.date || Date.now());
  const readableDate = Number.isNaN(receiptDate.getTime())
    ? String(transaction.date || "")
    : receiptDate.toLocaleString();

  overlay.style.cssText = `
    position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;
    align-items:center;justify-content:center;z-index:12000;padding:20px;
  `;

  overlay.innerHTML = `
    <div style="background:white;width:100%;max-width:430px;border-radius:20px;
      padding:25px;box-sizing:border-box;font-family:Arial,sans-serif;">
      <div style="text-align:center;border-bottom:1px dashed #d1d5db;padding-bottom:16px;">
        <div style="font-size:36px;">💳</div>
        <h2 style="margin:8px 0 4px;">LonerPay Receipt</h2>
        <small>One app. Everyday payments.</small>
      </div>
      <div style="line-height:1.7;padding:16px 0;word-break:break-word;">
        <div><strong>Receipt ID:</strong> ${escapeReceiptText(transaction.receiptId)}</div>
        <div><strong>Service:</strong> ${escapeReceiptText(transaction.type)}</div>
        <div><strong>Amount:</strong> ₦${Number(transaction.amount).toFixed(2)}</div>
        <div><strong>Details:</strong> ${escapeReceiptText(transaction.details)}</div>
        <div><strong>Status:</strong> ${escapeReceiptText(transaction.status || "Successful")}</div>
        <div><strong>Date:</strong> ${escapeReceiptText(readableDate)}</div>
      </div>
      <button type="button" class="download-receipt" style="width:100%;padding:14px;
        border:0;border-radius:11px;background:#111827;color:white;font-weight:bold;">
        Download Receipt
      </button>
      <button type="button" class="close-receipt" style="width:100%;padding:13px;
        border:0;background:transparent;font-weight:bold;margin-top:6px;">Close</button>
    </div>`;

  document.body.appendChild(overlay);
  overlay.querySelector(".close-receipt").onclick = () => overlay.remove();
  overlay.querySelector(".download-receipt").onclick = () =>
    downloadDigitalReceipt(transaction, readableDate);
}

function downloadDigitalReceipt(transaction, readableDate) {
  const receiptLines = [
    "LONERPAY DIGITAL RECEIPT",
    "One app. Everyday payments.",
    "--------------------------------",
    "Receipt ID: " + transaction.receiptId,
    "Service: " + transaction.type,
    "Amount: ₦" + Number(transaction.amount).toFixed(2),
    "Details: " + transaction.details,
    "Status: " + (transaction.status || "Successful"),
    "Date: " + readableDate,
    "--------------------------------",
    "Thank you for using LonerPay."
  ];
  const file = new Blob([receiptLines.join("\n")], { type: "text/plain;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(file);
  link.download = "LonerPay-Receipt-" + transaction.receiptId + ".txt";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

  "Data",

      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 20px;">
        <button type="button" class="fundQuick" data-amount="500" style="padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#f9fafb;font-weight:700;">₦500</button>
        <button type="button" class="fundQuick" data-amount="1000" style="padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#f9fafb;font-weight:700;">₦1,000</button>
        <button type="button" class="fundQuick" data-amount="5000" style="padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#f9fafb;font-weight:700;">₦5,000</button>
        <button type="button" class="fundQuick" data-amount="10000" style="padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#f9fafb;font-weight:700;">₦10,000</button>
      </div>

      <button id="fundWalletContinue" type="button"

        Continue to Payment
      </button>
      <button id="fundWalletCancel" type="button"
        style="width:100%;padding:13px;border:0;background:transparent;color:#4b5563;font-size:15px;font-weight:700;margin-top:6px;cursor:pointer;">

    </div>`;

  document.body.appendChild(overlay);

  const amountInput = overlay.querySelector("#fundWalletAmount");
  const errorBox = overlay.querySelector("#fundWalletError");
  const continueButton = overlay.querySelector("#fundWalletContinue");
  const close = () => overlay.remove();

  overlay.querySelector("#fundWalletClose").onclick = close;
  overlay.querySelector("#fundWalletCancel").onclick = close;
  overlay.querySelectorAll(".fundQuick").forEach(button => {
    button.onclick = () => {
      amountInput.value = button.dataset.amount;
      errorBox.textContent = "";
      amountInput.focus();
    };
  });

  continueButton.onclick = async () => {
    const amount = Number(amountInput.value);
    errorBox.textContent = "";

    if (!Number.isFinite(amount) || amount < 100) {
      errorBox.textContent = "Enter a valid funding amount of at least ₦100.";
      amountInput.focus();
      return;
    }

    const accessToken = localStorage.getItem("lonerpay_access_token");
    if (!accessToken) {
      errorBox.textContent = "Please log in again before funding your wallet.";
      return;
    }

    continueButton.disabled = true;
    continueButton.textContent = "Preparing secure payment...";
    continueButton.style.opacity = ".7";

    try {
      const response = await fetch("/api/fund-wallet/initialize", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${accessToken}`
        },
        body: JSON.stringify({ amount })
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || data.message || "Wallet funding is not connected yet.");
      }

      const paymentUrl = data.authorization_url || data.checkout_url || data.payment_url;
      if (!paymentUrl) throw new Error("Payment provider did not return a checkout link.");

      window.location.href = paymentUrl;
    } catch (error) {
      errorBox.textContent = error.message || "Could not start wallet funding.";
      continueButton.disabled = false;
      continueButton.textContent = "Continue to Payment";
      continueButton.style.opacity = "1";
    }
  };

  setTimeout(() => amountInput.focus(), 50);
}

// Verify wallet funding after returning from Paystack
(async function verifyWalletFundingReturn() {
  const params = new URLSearchParams(window.location.search);
  const reference =
    params.get("reference") ||
    params.get("trxref");

  if (!reference) return;

  try {
    const accessToken = localStorage.getItem("lonerpay_access_token");

    if (!accessToken) {
      throw new Error("Please log in again to verify wallet funding.");
    }

    const response = await fetch("/api/fund-wallet/verify", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${accessToken}`
      },
      body: JSON.stringify({ reference })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || data.message || "Wallet funding verification failed."
      );
    }

    // Remove Paystack reference from URL to prevent repeat verification
    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    alert("Wallet funded successfully.");

    // Reload dashboard so wallet balance and transactions refresh
    window.location.reload();

  } catch (error) {
    console.error("Wallet funding verification error:", error);
    alert(error.message || "Could not verify wallet funding.");
  }
})(); 
  
  function processWalletPayment(service, amount, details) { 
  amount = Number(amount);

  if (!Number.isFinite(amount) || amount <= 0) {
    alert("Invalid payment amount.");
    return false;
  }
let currentWalletBalance =
    Number(localStorage.getItem("lonerpay_balance")) || 0; 
  if (currentWalletBalance < amount) { 
    alert(
      "Insufficient wallet balance.\n\n" +
      "Required: ₦" + amount.toFixed(2) + "\n" +
      "Available: ₦" + currentWalletBalance.toFixed(2) 
    );
    return false;
  }


  currentWalletBalance -= amount;
localStorage.setItem("lonerpay_balance", currentWalletBalance);

const balanceEl = document.querySelector(".balance h2");
if (balanceEl) {
    balanceEl.textContent =
        "₦" + currentWalletBalance.toFixed(2);
} 
const savedTransactions =
    JSON.parse(localStorage.getItem("lonerPayTransactions")) || [];

savedTransactions.unshift({
    type: service,
    amount: Number(amount),
    details: details,
    date: new Date().toISOString()
});

localStorage.setItem(
    "lonerPayTransactions",
    JSON.stringify(savedTransactions.slice(0, 20))
); 
  const transactionsBox = document.querySelector(".transactions");

  if (transactionsBox) {
    const empty = transactionsBox.querySelector(".transaction");

    if (empty && empty.textContent.includes("No transactions yet")) {
      empty.remove();
    }

    const transaction = document.createElement("div");
    transaction.className = "transaction";

    transaction.textContent =
      service + " — ₦" + amount.toFixed(2) +
      " — Successful";

    transactionsBox.appendChild(transaction);
  }

  


  return true;
}
