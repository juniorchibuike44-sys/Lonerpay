<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LonerPay Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    .header h1 {
      margin: 0 0 5px;
    }

    .container {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .balance {
      background: #111827;
      color: white;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .balance small {
      opacity: 0.7;
    }

    .balance h2 {
      font-size: 32px;
      margin: 10px 0 0;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .service {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .service div {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .service h3 {
      margin: 5px 0;
    }

    .service p {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
    }

    .transactions {
      background: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
    }

    .transaction {
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .transaction:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>💳 LonerPay</h1>
    <div>One app. Everyday payments.</div>
  </div>

  <div class="container">

    <div class="balance">
      <small>Wallet Balance</small>
      <h2>₦0.00</h2>
    </div>

    <h2>Services</h2>

    <div class="services">

    
  <div class="service" onclick="buyAirtime()">
  <div>📱</div>
  <h3>Airtime</h3>
  <p>Buy airtime</p>
</div>
  
  

  
  

  


  
  

  
  
  

  

  
  
  
  

  

        
    
    
    
  

  
  
  

        
    
        


      

      <div class="service" onclick="buyData()">
  <div>📊</div>
  <h3>Data</h3>
  <p>Buy data</p>
</div>
        
        
        
      

      <div class="service" onclick="buyElectricity()">
  <div>⚡</div>
  <h3>Electricity</h3>
  <p>Pay electricity</p>
      </div> 
        
        
        
      

      <div class="service" onclick="buyTV()"> 
        <div>📺</div>
        <h3>TV</h3>
        <p>Pay TV subscription</p>
      </div>

    </div>

    <div class="transactions">
      <h2>Recent Transactions</h2>

      <div class="transaction">
        No transactions yet.
      </div>

    </div>

  </div>

  );
<script>function recordTransaction(type, amount, details) {
  const transactionsBox = document.querySelector(".transactions");
  if (!transactionsBox) return;

  const empty = transactionsBox.querySelector(".transaction");

  if (empty && empty.textContent.includes("No transactions yet")) {
    empty.remove();
  }

  const transaction = document.createElement("div");
  transaction.className = "transaction";

  transaction.innerHTML =
    "<strong>" + type + "</strong><br>" +
    "₦" + Number(amount).toFixed(2) + "<br>" +
    "<small>" + details + "</small>";

  transactionsBox.appendChild(transaction);
} 
function buyAirtime() {
  const phone = prompt("Enter phone number:");
  if (!phone) return;

  const network = prompt("Enter network: MTN, Airtel, Glo or 9mobile:");
  if (!network) return;

  const amount = prompt("Enter airtime amount (₦):");
  if (!amount) return;

  if (!processPayment(
  "Airtime",
  amount,
  "Phone: " + phone + "\nNetwork: " + network
)) return; 
    
  
    
    
    
    
    
    
  

}
function buyData() {
  const phone = prompt("Enter phone number:");
  if (!phone) return;

  const network = prompt("Enter network: MTN, Airtel, Glo, or 9mobile:");
  if (!network) return;

  const plan = prompt("Enter data plan (e.g. 1GB, 2GB, 5GB):");
  if (!plan) return;

  const amount = prompt("Enter data amount:");
  if (!amount) return;

  alert(
    "Data Order" +
    String.fromCharCode(10, 10) +
    "Phone: " + phone +
    String.fromCharCode(10) +
    "Network: " + network +
    String.fromCharCode(10) +
    "Plan: " + plan +
    String.fromCharCode(10) +
    "Amount: ₦" + amount +
    String.fromCharCode(10, 10) +
    "Ready for payment."
  );
}
function buyElectricity() {
  const meterNumber = prompt("Enter meter number:");
  if (!meterNumber) return;

  const meterType = prompt("Enter meter type: Prepaid or Postpaid");
  if (!meterType) return;

  const amount = prompt("Enter electricity amount:");
  if (!amount) return;

  alert(
    "Electricity Order\n\n" +
    "Meter: " + meterNumber + "\n" +
    "Type: " + meterType + "\n" +
    "Amount: ₦" + amount + "\n\n" +
    "Ready for payment."
  );
}function buyTV() {
  const provider = prompt("Enter TV provider: DStv, GOtv, or Startimes");
  if (!provider) return;

  const smartcard = prompt("Enter IUC/Smartcard number:");
  if (!smartcard) return;

  const plan = prompt("Enter TV plan:");
  if (!plan) return;

  const amount = prompt("Enter subscription amount:");
  if (!amount) return;

  alert(
    "TV Subscription Order\n\n" +
    "Provider: " + provider + "\n" +
    "IUC/Smartcard: " + smartcard + "\n" +
    "Plan: " + plan + "\n" +
    "Amount: ₦" + amount + "\n\n" +
    "Ready for payment."
  );
}// LonerPay demo wallet
let walletBalance = Number(localStorage.getItem("lonerpay_balance") || 0);

function updateWalletDisplay() {
  const balance = document.querySelector(".balance h2");
  if (balance) {
    balance.textContent = "₦" + walletBalance.toFixed(2);
  }
}

function addDemoFunds() {
  const amount = prompt("Enter demo wallet amount:");
  if (!amount || isNaN(amount) || Number(amount) <= 0) return;

  walletBalance += Number(amount);
  localStorage.setItem("lonerpay_balance", walletBalance);
  updateWalletDisplay();

  alert("Wallet funded successfully!\n\nBalance: ₦" + walletBalance.toFixed(2));
}function processPayment(service, amount, details) {
  amount = Number(amount);

  if (!Number.isFinite(amount) || amount <= 0) {
    alert("Invalid payment amount.");
    return false;
  }

  if (walletBalance < amount) {
    alert(
      "Insufficient wallet balance.\n\n" +
      "Required: ₦" + amount.toFixed(2) + "\n" +
      "Available: ₦" + walletBalance.toFixed(2)
    );
    return false;
  }

  walletBalance -= amount;
  localStorage.setItem("lonerpay_balance", walletBalance);
  updateWalletDisplay();

  const transactionsBox = document.querySelector(".transactions");

  if (transactionsBox) {
    const empty = transactionsBox.querySelector(".transaction");

    if (empty && empty.textContent.includes("No transactions yet")) {
      empty.remove();
    }

    const transaction = document.createElement("div");
    transaction.className = "transaction";

    transaction.textContent =
      service + " — ₦" + amount.toFixed(2) +
      " — Successful";

    transactionsBox.appendChild(transaction);
  }

  alert(
    service + " payment successful!\n\n" +
    details + "\n" +
    "Amount: ₦" + amount.toFixed(2) + "\n\n" +
    "Remaining balance: ₦" + walletBalance.toFixed(2)
  );

  return true;
} 

document.addEventListener("DOMContentLoaded", function () {
  updateWalletDisplay();

  const walletButton = document.createElement("button");
  walletButton.textContent = "＋ Add Demo Funds";
  walletButton.onclick = addDemoFunds;
  walletButton.style.cssText =
    "margin-top:10px;padding:12px 18px;border:0;border-radius:10px;background:#111827;color:white;font-size:16px;";

  const balanceBox = document.querySelector(".balance");
  if (balanceBox) {
    balanceBox.appendChild(walletButton);
  }
});  
</script> 
</body>
</html>
